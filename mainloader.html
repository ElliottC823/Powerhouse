<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ElliottC823/powerhouse/main/icons/POWERHOUSE-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powerhouse</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background: #0d0e12; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* The Loading Circle */
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid #0066FF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        #loader-text {
            color: #0066FF;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 14px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #content { display: none; }
    </style>
</head>
<body>

    <div id="loader-container">
        <div class="spinner"></div>
        <div id="loader-text">LOADING POWERHOUSE</div>
    </div>

    <div id="content"></div>

    <script>
        async function loadPowerhouse() {
            const loaderText = document.getElementById('loader-text');
            const repoURL = 'https://raw.githubusercontent.com/ElliottC823/powerhouse/main/index.html';
            
            try {
                const response = await fetch(repoURL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const html = await response.text();
                
                // Fix for relative assets: Inject a <base> tag so images/css load from GitHub
                const baseTag = `<base href="https://raw.githubusercontent.com/ElliottC823/powerhouse/main/">`;
                const processedHtml = html.replace('<head>', `<head>${baseTag}`);

                document.open();
                document.write(processedHtml);
                document.close();
            } catch (error) {
                loaderText.innerText = "LOAD FAILED. CHECK CONNECTION.";
                loaderText.style.color = "#ff4444";
                console.error("Powerhouse Load Error:", error);
            }
        }

        // Slight delay to ensure the spinner is visible if the catch is instant
        window.addEventListener('load', () => {
            setTimeout(loadPowerhouse, 500);
        });
    </script>
</body>
</html>

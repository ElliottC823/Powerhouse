<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Camera — Powerhouse</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--accent:#0078D4;--accent2:#106EBE;--bg:#0d0e12;--surface:#1e2028;--surface2:#252830;--text:#f5f6fa;--muted:rgba(245,246,250,0.45);--border:#35394a;--radius:8px;--radius-sm:6px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Segoe UI Variable','Segoe UI','Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none;}
header{height:48px;flex-shrink:0;background:linear-gradient(90deg,#13151b,#1a1c24);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10;}
.header-title{font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.header-btn{background:transparent;border:1px solid transparent;border-radius:var(--radius-sm);padding:5px 12px;color:var(--muted);font-family:inherit;font-size:.75rem;font-weight:600;cursor:pointer;transition:color .1s,background .1s;display:flex;align-items:center;gap:6px;}
.header-btn:hover{color:var(--text);background:rgba(255,255,255,.06);}
.header-btn svg{width:14px;height:14px;flex-shrink:0;}
main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
#viewfinder-wrap{flex:1;position:relative;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;}
#video{width:100%;height:100%;object-fit:cover;display:block;transition:filter .3s;}
.grid-overlay{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;background-image:linear-gradient(rgba(255,255,255,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.15) 1px,transparent 1px);background-size:33.33% 33.33%;}
.grid-overlay.show{opacity:1;}
#focus-ring{position:absolute;width:60px;height:60px;border:2px solid var(--accent);border-radius:4px;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(1.4);transition:opacity .15s,transform .25s cubic-bezier(.2,.8,.3,1);box-shadow:0 0 0 1px rgba(0,120,212,.3);}
#focus-ring.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
#no-camera{display:none;position:absolute;inset:0;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:12px;}
#no-camera svg{width:48px;height:48px;opacity:.3;}
#no-camera p{font-size:.85rem;color:var(--muted);text-align:center;max-width:220px;line-height:1.6;}
.allow-btn{background:var(--accent);color:#fff;border:none;padding:9px 22px;border-radius:var(--radius-sm);font-family:inherit;font-weight:700;font-size:.82rem;cursor:pointer;transition:background .1s;}
.allow-btn:hover{background:var(--accent2);}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .05s;}
#flash.snap{opacity:.8;}
#zoom-badge{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .3s;backdrop-filter:blur(8px);}
#zoom-badge.show{opacity:1;}
#filter-strip{height:56px;flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:8px;overflow-x:auto;scrollbar-width:none;}
#filter-strip::-webkit-scrollbar{display:none;}
.filter-chip{flex-shrink:0;padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:inherit;font-size:.72rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .1s;}
.filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.filter-chip:hover:not(.active){border-color:var(--accent);color:var(--text);}
#controls{height:96px;flex-shrink:0;background:linear-gradient(180deg,var(--surface2) 0%,#1a1c22 100%);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:0 20px;padding-bottom:env(safe-area-inset-bottom,0px);}
#thumb-btn{width:52px;height:52px;border-radius:var(--radius);overflow:hidden;border:2px solid var(--border);background:var(--surface);cursor:pointer;transition:border-color .15s,transform .1s;flex-shrink:0;position:relative;}
#thumb-btn:hover{border-color:var(--accent);}
#thumb-btn:active{transform:scale(.93);}
#thumb-img{width:100%;height:100%;object-fit:cover;display:none;}
#thumb-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);}
#thumb-placeholder svg{width:20px;height:20px;}
#shutter{width:68px;height:68px;border-radius:50%;background:transparent;border:3px solid var(--text);cursor:pointer;position:relative;flex-shrink:0;transition:transform .1s,border-color .1s;display:flex;align-items:center;justify-content:center;}
#shutter::after{content:'';width:54px;height:54px;border-radius:50%;background:var(--text);transition:background .1s,transform .1s,width .15s,height .15s,border-radius .15s;}
#shutter:hover::after{background:var(--accent);}
#shutter:hover{border-color:var(--accent);}
#shutter:active{transform:scale(.92);}
#shutter:active::after{transform:scale(.88);}
#shutter.recording{border-color:#c42b1c;}
#shutter.recording::after{background:#c42b1c;border-radius:6px;width:28px;height:28px;}
#flip-btn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .1s,transform .15s;}
#flip-btn:hover{background:rgba(255,255,255,.12);}
#flip-btn:active{transform:rotate(180deg) scale(.9);}
#flip-btn svg{width:22px;height:22px;}
#mode-bar{background:var(--surface2);border-top:1px solid var(--border);display:flex;justify-content:center;gap:0;flex-shrink:0;}
.mode-tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 18px;color:var(--muted);font-family:inherit;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:color .1s,border-color .1s;}
.mode-tab:hover{color:var(--text);}
.mode-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
#icon-bar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:4px;padding:4px 8px;flex-shrink:0;}
.icon-btn{background:transparent;border:1px solid transparent;border-radius:var(--radius-sm);padding:5px 8px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:4px;font-family:inherit;font-size:.68rem;font-weight:600;transition:color .1s,background .1s,border-color .1s;white-space:nowrap;}
.icon-btn svg{width:15px;height:15px;flex-shrink:0;}
.icon-btn:hover{color:var(--text);background:rgba(255,255,255,.06);}
.icon-btn.active{color:var(--accent);border-color:rgba(0,120,212,.4);background:rgba(0,120,212,.1);}
#gallery-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);backdrop-filter:blur(20px);flex-direction:column;}
#gallery-overlay.show{display:flex;}
.gallery-header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);background:#13151b;flex-shrink:0;}
.gallery-title{font-size:.82rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;}
.gallery-close{background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 12px;color:var(--text);font-family:inherit;font-size:.72rem;font-weight:600;cursor:pointer;transition:background .1s;}
.gallery-close:hover{background:rgba(255,255,255,.12);}
#gallery-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:3px;overflow-y:auto;padding:3px;}
.gallery-item{aspect-ratio:1;overflow:hidden;cursor:pointer;position:relative;border-radius:2px;transition:transform .1s;}
.gallery-item:hover{transform:scale(.97);}
.gallery-item img,.gallery-item video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
.gallery-video-badge{position:absolute;bottom:4px;right:6px;background:rgba(0,0,0,.65);color:#fff;font-size:.6rem;font-weight:700;padding:2px 5px;border-radius:3px;}
.gallery-empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:10px;opacity:.35;}
.gallery-empty svg{width:40px;height:40px;}
.gallery-empty p{font-size:.82rem;}
#lightbox{display:none;position:fixed;inset:0;z-index:300;background:#000;flex-direction:column;}
#lightbox.show{display:flex;}
.lb-header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(0,0,0,.8);border-bottom:1px solid var(--border);flex-shrink:0;}
.lb-title{font-size:.78rem;font-weight:600;color:var(--muted);}
.lb-actions{display:flex;gap:6px;}
.lb-btn{background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 12px;color:var(--text);font-family:inherit;font-size:.72rem;font-weight:600;cursor:pointer;transition:background .1s;display:flex;align-items:center;gap:5px;}
.lb-btn:hover{background:rgba(255,255,255,.14);}
.lb-btn.danger{color:#c42b1c;border-color:rgba(196,43,28,.3);}
.lb-btn.danger:hover{background:rgba(196,43,28,.1);}
.lb-btn svg{width:13px;height:13px;}
#lb-content{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#lb-img{max-width:100%;max-height:100%;object-fit:contain;display:none;}
#lb-video{max-width:100%;max-height:100%;display:none;}
#timer-display{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:6rem;font-weight:900;color:#fff;text-shadow:0 4px 32px rgba(0,0,0,.8);opacity:0;transition:opacity .2s;}
#timer-display.show{opacity:1;}
#rec-badge{position:absolute;top:12px;right:12px;background:rgba(196,43,28,.85);color:#fff;font-size:.65rem;font-weight:900;letter-spacing:.1em;padding:3px 8px;border-radius:4px;display:none;align-items:center;gap:5px;backdrop-filter:blur(4px);}
#rec-badge.show{display:flex;}
.rec-dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
*{scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;}}
</style>
</head>
<body>
<header>
  <span class="header-title">📷 Camera</span>
  <div style="display:flex;gap:6px;">
    <button class="header-btn" onclick="toggleGallery()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      Gallery
    </button>
  </div>
</header>
<div id="icon-bar">
  <button class="icon-btn" id="btn-grid" onclick="toggleGrid()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg>Grid
  </button>
  <button class="icon-btn" id="btn-timer" onclick="cycleTimer()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 3h6"/></svg>
    <span id="timer-label">Off</span>
  </button>
  <button class="icon-btn" id="btn-mirror" onclick="toggleMirror()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 6l9-3 9 3M3 18l9 3 9-3"/></svg>Mirror
  </button>
  <button class="icon-btn" onclick="adjustZoom(-0.5)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35M8 11h6"/></svg>
  </button>
  <button class="icon-btn" onclick="adjustZoom(0.5)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35M11 8v6M8 11h6"/></svg>
  </button>
</div>
<div id="mode-bar">
  <button class="mode-tab active" onclick="setMode('photo',this)">Photo</button>
  <button class="mode-tab" onclick="setMode('video',this)">Video</button>
</div>
<main>
  <div id="viewfinder-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div class="grid-overlay" id="grid-overlay"></div>
    <div id="focus-ring"></div>
    <div id="flash"></div>
    <div id="timer-display"></div>
    <div id="rec-badge"><div class="rec-dot"></div> REC</div>
    <div id="zoom-badge">1.0×</div>
    <div id="no-camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      <p>Camera access required.</p>
      <button class="allow-btn" onclick="startCamera()">Allow Camera</button>
    </div>
  </div>
  <div id="filter-strip">
    <button class="filter-chip active" onclick="setFilter('none',this)">Normal</button>
    <button class="filter-chip" onclick="setFilter('grayscale(100%)',this)">B&W</button>
    <button class="filter-chip" onclick="setFilter('sepia(80%)',this)">Sepia</button>
    <button class="filter-chip" onclick="setFilter('contrast(1.4) saturate(1.6)',this)">Vivid</button>
    <button class="filter-chip" onclick="setFilter('hue-rotate(180deg) saturate(1.3)',this)">Invert+</button>
    <button class="filter-chip" onclick="setFilter('brightness(1.15) contrast(1.1)',this)">Bright</button>
    <button class="filter-chip" onclick="setFilter('brightness(0.85) contrast(1.25) saturate(0.8)',this)">Matte</button>
    <button class="filter-chip" onclick="setFilter('saturate(2) hue-rotate(20deg)',this)">Warm</button>
    <button class="filter-chip" onclick="setFilter('saturate(0.6) brightness(1.1) hue-rotate(200deg)',this)">Cool</button>
  </div>
</main>
<div id="controls">
  <button id="thumb-btn" onclick="openLastCapture()">
    <img id="thumb-img" alt="Last capture">
    <div id="thumb-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>
  </button>
  <button id="shutter" onclick="handleShutter()"></button>
  <button id="flip-btn" onclick="flipCamera()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
  </button>
</div>
<div id="gallery-overlay">
  <div class="gallery-header">
    <span class="gallery-title">Gallery</span>
    <button class="gallery-close" onclick="toggleGallery()">Close</button>
  </div>
  <div id="gallery-grid"></div>
</div>
<div id="lightbox">
  <div class="lb-header">
    <span class="lb-title" id="lb-title">Photo</span>
    <div class="lb-actions">
      <button class="lb-btn" onclick="downloadCapture()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Save</button>
      <button class="lb-btn danger" onclick="deleteCapture()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>Delete</button>
      <button class="lb-btn" onclick="closeLightbox()">✕</button>
    </div>
  </div>
  <div id="lb-content">
    <img id="lb-img" alt="Capture">
    <video id="lb-video" controls></video>
  </div>
</div>
<canvas id="snapshot-canvas" style="display:none"></canvas>
<script>
let stream=null,facingMode='environment',currentFilter='none',mirrorMode=false,zoomLevel=1,gridOn=false,timerSeconds=0,timerCycle=[0,3,10],timerIdx=0,mode='photo',mediaRecorder=null,recordedChunks=[],isRecording=false,captures=[],currentLightboxIdx=-1;
const video=document.getElementById('video'),canvas=document.getElementById('snapshot-canvas'),ctx=canvas.getContext('2d'),noCamera=document.getElementById('no-camera'),focusRing=document.getElementById('focus-ring'),flashEl=document.getElementById('flash'),zoomBadge=document.getElementById('zoom-badge'),recBadge=document.getElementById('rec-badge'),timerDisplay=document.getElementById('timer-display');
async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());const c={video:{facingMode,width:{ideal:1920},height:{ideal:1080}},audio:mode==='video'};stream=await navigator.mediaDevices.getUserMedia(c);video.srcObject=stream;noCamera.style.display='none';applyZoom();}catch(e){noCamera.style.display='flex';}}
function flipCamera(){facingMode=facingMode==='environment'?'user':'environment';startCamera();}
function toggleMirror(){mirrorMode=!mirrorMode;video.style.transform=mirrorMode?'scaleX(-1)':'';document.getElementById('btn-mirror').classList.toggle('active',mirrorMode);}
function setFilter(f,el){currentFilter=f;video.style.filter=f;document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');}
function toggleGrid(){gridOn=!gridOn;document.getElementById('grid-overlay').classList.toggle('show',gridOn);document.getElementById('btn-grid').classList.toggle('active',gridOn);}
function cycleTimer(){timerIdx=(timerIdx+1)%timerCycle.length;timerSeconds=timerCycle[timerIdx];document.getElementById('timer-label').textContent=['Off','3s','10s'][timerIdx];document.getElementById('btn-timer').classList.toggle('active',timerSeconds>0);}
let zoomTimeout;
function adjustZoom(d){zoomLevel=Math.min(5,Math.max(1,zoomLevel+d));applyZoom();zoomBadge.textContent=zoomLevel.toFixed(1)+'×';zoomBadge.classList.add('show');clearTimeout(zoomTimeout);zoomTimeout=setTimeout(()=>zoomBadge.classList.remove('show'),1500);}
function applyZoom(){if(!stream)return;const track=stream.getVideoTracks()[0];if(!track)return;try{const caps=track.getCapabilities?track.getCapabilities():{};if(caps.zoom){track.applyConstraints({advanced:[{zoom:zoomLevel}]}).catch(()=>{});}else{video.style.transform=(mirrorMode?'scaleX(-1) ':'')+'scale('+zoomLevel+')';}}catch(e){}}
document.getElementById('viewfinder-wrap').addEventListener('click',e=>{const w=e.currentTarget.getBoundingClientRect(),x=e.clientX-w.left,y=e.clientY-w.top;focusRing.style.left=x+'px';focusRing.style.top=y+'px';focusRing.classList.remove('show');void focusRing.offsetWidth;focusRing.classList.add('show');setTimeout(()=>focusRing.classList.remove('show'),900);});
function setMode(m,el){mode=m;document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');if(isRecording)stopRecording();startCamera();}
function handleShutter(){if(timerSeconds>0&&mode==='photo'){runTimer(timerSeconds,takePhoto);}else if(mode==='photo'){takePhoto();}else{isRecording?stopRecording():startRecording();}}
function runTimer(secs,cb){let count=secs;timerDisplay.textContent=count;timerDisplay.classList.add('show');const iv=setInterval(()=>{count--;if(count<=0){clearInterval(iv);timerDisplay.classList.remove('show');cb();}else{timerDisplay.textContent=count;}},1000);}
function takePhoto(){if(!stream)return;const track=stream.getVideoTracks()[0],settings=track.getSettings();canvas.width=settings.width||video.videoWidth||1280;canvas.height=settings.height||video.videoHeight||720;ctx.save();if(mirrorMode){ctx.translate(canvas.width,0);ctx.scale(-1,1);}ctx.filter=currentFilter;ctx.drawImage(video,0,0,canvas.width,canvas.height);ctx.restore();flashEl.classList.add('snap');setTimeout(()=>flashEl.classList.remove('snap'),200);canvas.toBlob(b=>{addCapture({type:'photo',url:URL.createObjectURL(b),blob:b});},'image/jpeg',.95);}
function startRecording(){if(!stream)return;recordedChunks=[];const opts=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?{mimeType:'video/webm;codecs=vp9'}:MediaRecorder.isTypeSupported('video/webm')?{mimeType:'video/webm'}:{};try{mediaRecorder=new MediaRecorder(stream,opts);}catch(e){mediaRecorder=new MediaRecorder(stream);}mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recordedChunks.push(e.data);};mediaRecorder.onstop=saveRecording;mediaRecorder.start(100);isRecording=true;document.getElementById('shutter').classList.add('recording');recBadge.classList.add('show');}
function stopRecording(){if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();isRecording=false;document.getElementById('shutter').classList.remove('recording');recBadge.classList.remove('show');}
function saveRecording(){const b=new Blob(recordedChunks,{type:mediaRecorder.mimeType||'video/webm'});addCapture({type:'video',url:URL.createObjectURL(b),blob:b});}
function addCapture(cap){captures.unshift(cap);updateThumbnail();}
function updateThumbnail(){if(!captures.length)return;const l=captures[0];if(l.type==='photo'){document.getElementById('thumb-img').src=l.url;document.getElementById('thumb-img').style.display='block';document.getElementById('thumb-placeholder').style.display='none';}}
function openLastCapture(){if(!captures.length){toggleGallery();return;}openLightbox(0);}
function toggleGallery(){const o=document.getElementById('gallery-overlay');o.classList.toggle('show');if(o.classList.contains('show'))renderGallery();}
function renderGallery(){const g=document.getElementById('gallery-grid');if(!captures.length){g.innerHTML='<div class="gallery-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><p>No captures yet</p></div>';return;}g.innerHTML=captures.map((c,i)=>`<div class="gallery-item" onclick="openLightbox(${i})">${c.type==='photo'?`<img src="${c.url}" alt="Photo">`:`<video src="${c.url}" muted></video><span class="gallery-video-badge">▶ VIDEO</span>`}</div>`).join('');}
function openLightbox(idx){currentLightboxIdx=idx;const c=captures[idx],lb=document.getElementById('lightbox'),lbImg=document.getElementById('lb-img'),lbVid=document.getElementById('lb-video');lbImg.style.display='none';lbVid.style.display='none';lbVid.pause&&lbVid.pause();if(c.type==='photo'){lbImg.src=c.url;lbImg.style.display='block';document.getElementById('lb-title').textContent='Photo '+(captures.length-idx);}else{lbVid.src=c.url;lbVid.style.display='block';document.getElementById('lb-title').textContent='Video '+(captures.length-idx);}lb.classList.add('show');document.getElementById('gallery-overlay').classList.remove('show');}
function closeLightbox(){document.getElementById('lightbox').classList.remove('show');document.getElementById('lb-video').pause();document.getElementById('lb-video').src='';document.getElementById('lb-img').src='';}
function downloadCapture(){if(currentLightboxIdx<0)return;const c=captures[currentLightboxIdx],a=document.createElement('a');a.href=c.url;a.download=c.type==='photo'?`photo_${Date.now()}.jpg`:`video_${Date.now()}.webm`;a.click();}
function deleteCapture(){if(currentLightboxIdx<0)return;URL.revokeObjectURL(captures[currentLightboxIdx].url);captures.splice(currentLightboxIdx,1);closeLightbox();if(captures.length){updateThumbnail();}else{document.getElementById('thumb-img').style.display='none';document.getElementById('thumb-placeholder').style.display='flex';}}
startCamera();
</script>
</body>
</html>

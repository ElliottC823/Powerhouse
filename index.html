<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Powerhouse</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ElliottC823/powerhouse/main/POWERHOUSE-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-default: #0066FF;
            --accent: #0066FF;
            --bg: #13151b;
            --bg-image: url('https://raw.githubusercontent.com/ElliottC823/powerhouse/main/background-dark.svg');
            --header-bg: url('https://raw.githubusercontent.com/ElliottC823/powerhouse/main/topbar-dark.svg');
            --surface: #1e2028;
            --text: #f5f6fa;
            --border: #35394a;
            --radius: 24px;
            --shadow: 0 4px 15px rgba(0,0,0,0.2);
            --header-height: 64px;
            /* Safe area insets for notched phones */
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        [data-theme="light"] {
            --bg: #f0f2f5;
            --bg-image: url('https://raw.githubusercontent.com/ElliottC823/powerhouse/main/background-light.svg');
            --header-bg: url('https://raw.githubusercontent.com/ElliottC823/powerhouse/main/topbar-light.svg');
            --surface: #ffffff;
            --text: #0a0a0a;
            --border: #d1d9e6;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        [data-corners="sharp"] { --radius: 0px !important; }

        /* Reduce motion for users who prefer it or for performance */
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }

        /* Only animate non-layout properties for performance */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Remove tap flash on mobile */
        }

        /* Separate transform transitions from color transitions for compositing */
        .game-card, .shelf-item, .filter-btn {
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            background-image: var(--bg-image);
            /* Use scroll instead of fixed — fixed backgrounds are GPU-expensive on mobile */
            background-attachment: scroll;
            background-size: cover;
            background-position: center top;
            color: var(--text);
            margin: 0;
            overflow-x: hidden;
            /* Smooth scrolling on iOS */
            -webkit-overflow-scrolling: touch;
            /* Account for notch/home bar */
            padding-left: var(--safe-left);
            padding-right: var(--safe-right);
            padding-bottom: var(--safe-bottom);
        }

        /* ── HEADER ── */
        header {
            background-image: var(--header-bg);
            background-size: cover;
            padding: 0 clamp(12px, 4%, 5%);
            padding-top: var(--safe-top);
            height: calc(var(--header-height) + var(--safe-top));
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--border);
        }

        .logo-img {
            height: 32px;
            flex-shrink: 0;
            /* Prevent logo from being too large on small screens */
            max-width: 120px;
            object-fit: contain;
        }

        .search-container {
            flex-grow: 1;
            min-width: 0; /* Allow it to shrink below intrinsic size */
            max-width: 400px;
        }

        #searchInput {
            width: 100%;
            padding: 9px 16px;
            border-radius: var(--radius);
            border: 2px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-family: inherit;
            font-weight: 700;
            font-size: 16px; /* 16px prevents iOS auto-zoom on focus */
            outline: none;
            transition: border-color 0.2s;
        }

        #searchInput:focus { border-color: var(--accent); }

        .controls { flex-shrink: 0; }

        .settings-btn {
            background: var(--surface);
            border: 2px solid var(--border);
            padding: 9px 12px;
            border-radius: var(--radius);
            font-weight: 900;
            cursor: pointer;
            color: var(--text);
            font-size: 1rem;
            line-height: 1;
            /* Minimum 44×44 touch target */
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
        }

        .settings-btn:active { opacity: 0.7; }

        /* ── CONTINUE PLAYING SHELF ── */
        .shelf-container { padding: 16px clamp(12px, 4%, 5%); display: none; }
        .shelf-title { font-weight: 900; font-size: 1.1rem; margin-bottom: 12px; }

        .shelf-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            /* Hide scrollbar cross-browser */
            scrollbar-width: none;
            -ms-overflow-style: none;
            /* Momentum scrolling on iOS */
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x proximity;
        }
        .shelf-scroll::-webkit-scrollbar { display: none; }

        .shelf-item {
            flex: 0 0 90px;
            min-width: 0;
            text-align: center;
            text-decoration: none;
            color: inherit;
            position: relative;
            scroll-snap-align: start;
            overflow: hidden;
            /* Larger touch target */
            padding: 4px;
        }

        .shelf-img {
            width: 72px;
            height: 72px;
            border-radius: var(--radius);
            object-fit: cover;
            border: 2px solid var(--border);
            margin-bottom: 6px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .shelf-label {
            font-size: 0.72rem;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            /* Constrained to parent shelf-item width so ellipsis fires */
            display: block;
            width: 0;
            min-width: 100%;
        }

        .shelf-verified {
            position: absolute;
            top: 0;
            right: 8px;
            width: 18px;
            height: 18px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        /* ── FILTER BAR ── */
        .filter-bar {
            display: flex;
            gap: 8px;
            padding: 8px clamp(12px, 4%, 5%);
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x proximity;
        }
        .filter-bar::-webkit-scrollbar { display: none; }

        .filter-btn {
            background: var(--surface);
            border: 2px solid var(--border);
            padding: 8px 18px;
            border-radius: var(--radius);
            font-weight: 900;
            font-family: inherit;
            cursor: pointer;
            color: var(--text);
            white-space: nowrap;
            font-size: 0.85rem;
            /* 44px minimum touch target height */
            min-height: 44px;
            scroll-snap-align: start;
            flex-shrink: 0;
        }
        .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .filter-btn:active { opacity: 0.7; }

        /* ── GAME GRID ── */
        #game-grid {
            display: grid;
            /* 
              Mobile: 2 columns
              Tablet/Chromebook: 3 columns
              Desktop: auto-fill ~280px
            */
            grid-template-columns: repeat(2, 1fr);
            gap: clamp(10px, 2.5vw, 25px);
            padding: clamp(10px, 3%, 20px) clamp(12px, 4%, 5%);
        }

        /* Tablet / Chromebook landscape */
        @media (min-width: 600px) {
            #game-grid { grid-template-columns: repeat(3, 1fr); }
        }

        /* Desktop */
        @media (min-width: 900px) {
            #game-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
        }

        .game-card {
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow);
            border: 2px solid var(--border);
            display: block;
            transition: border-color 0.2s ease, transform 0.15s ease;
            /* Prevent text selection on long-press */
            -webkit-user-select: none;
            user-select: none;
        }

        /* Hover only on pointer devices (not touch) */
        @media (hover: hover) {
            .game-card:hover { transform: translateY(-4px); border-color: var(--accent); }
        }

        .game-card:active { transform: scale(0.97); }

        .thumb-wrap { width: 100%; aspect-ratio: 16/9; overflow: hidden; }
        .thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Lazy-load images for performance */
            loading: lazy;
            display: block;
        }

        .game-info {
            padding: clamp(8px, 2%, 15px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .game-title-container { display: flex; align-items: center; gap: 5px; min-width: 0; }

        .game-title {
            font-weight: 900;
            font-size: clamp(0.75rem, 2.5vw, 1rem);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .play-btn {
            background: var(--accent);
            color: white;
            padding: 5px 12px;
            border-radius: var(--radius);
            font-weight: 900;
            font-size: 0.7rem;
            white-space: nowrap;
            flex-shrink: 0;
            /* Min touch target */
            min-height: 32px;
            display: flex;
            align-items: center;
        }

        .verified-badge { width: 14px; height: 14px; cursor: help; flex-shrink: 0; }

        /* ── SETTINGS MENU ── */
        .settings-menu {
            display: none;
            position: fixed;
            /* On mobile, pin to bottom like a sheet */
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            padding: 20px clamp(16px, 5%, 24px);
            padding-bottom: calc(20px + var(--safe-bottom));
            border-radius: var(--radius) var(--radius) 0 0;
            border: 2px solid var(--accent);
            border-bottom: none;
            z-index: 2000;
            max-height: 80vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.4);
            /* Smooth slide-up animation */
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
        }

        /* On tablets/desktop, show as a popover */
        @media (min-width: 600px) {
            .settings-menu {
                bottom: auto;
                left: auto;
                top: calc(var(--header-height) + var(--safe-top) + 8px);
                right: clamp(12px, 4%, 5%);
                border-radius: var(--radius);
                border-bottom: 2px solid var(--accent);
                width: min(300px, 90vw);
                max-height: 80vh;
                transform: translateY(-10px);
                opacity: 0;
                transition: transform 0.2s ease, opacity 0.2s ease;
            }
            .settings-menu.show {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .settings-menu.show {
            display: block;
            transform: translateY(0);
            opacity: 1;
        }

        /* Drag handle for bottom sheet on mobile */
        .sheet-handle {
            width: 40px;
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            margin: 0 auto 16px;
            display: block;
        }

        @media (min-width: 600px) {
            .sheet-handle { display: none; }
        }

        /* Backdrop for mobile settings sheet */
        .settings-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1999;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .settings-backdrop.show { display: block; opacity: 1; }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            font-weight: 700;
            font-size: 0.9rem;
            gap: 10px;
        }

        /* Larger touch targets for toggles */
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
        }

        input[type="color"] {
            width: 44px;
            height: 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            padding: 2px;
            background: transparent;
            flex-shrink: 0;
        }

        .accent-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .reset-accent-btn {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.65rem;
            font-weight: 900;
            font-family: inherit;
            min-height: 32px;
            padding: 0 8px;
            white-space: nowrap;
            transition: border-color 0.2s, color 0.2s;
        }
        .reset-accent-btn:hover { border-color: var(--accent); color: var(--accent); }
        .reset-accent-btn:active { opacity: 0.7; }

        .divider { border-top: 1px solid var(--border); margin: 14px 0; padding-top: 14px; }
        h4 { margin: 0 0 8px 0; font-size: 0.85rem; text-transform: uppercase; color: var(--accent); }
        .small-text { font-size: 0.8rem; line-height: 1.5; opacity: 0.8; }
        .contributor-list { display: flex; flex-direction: column; gap: 5px; font-size: 0.8rem; font-weight: 700; }
        .mirror-link { color: var(--accent); text-decoration: none; font-weight: 700; display: block; margin-bottom: 5px; padding: 4px 0; }

        .reset-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 900;
            font-family: inherit;
            /* Minimum touch target */
            min-height: 36px;
        }
        .reset-btn:active { opacity: 0.7; }

        /* ── EMPTY STATE ── */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            opacity: 0.5;
            font-weight: 700;
            font-size: 1rem;
        }

        /* ── TUTORIAL OVERLAY ── */
        .tutorial-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9000;
            pointer-events: none;
        }
        .tutorial-overlay.active { display: block; }

        .tutorial-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            pointer-events: all;
        }

        /* The cutout highlight — a transparent hole punched over the target */
        .tutorial-highlight {
            position: absolute;
            border-radius: var(--radius);
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.72), 0 0 0 3px var(--accent);
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 9001;
        }

        .tutorial-card {
            position: absolute;
            background: var(--surface);
            border: 2px solid var(--accent);
            border-radius: var(--radius);
            padding: 18px 20px;
            width: min(300px, 88vw);
            z-index: 9002;
            pointer-events: all;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tutorial-step-label {
            font-size: 0.65rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .tutorial-title {
            font-size: 1rem;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .tutorial-body {
            font-size: 0.82rem;
            line-height: 1.55;
            opacity: 0.8;
            margin-bottom: 16px;
        }

        .tutorial-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .tutorial-dots {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .tutorial-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--border);
            transition: background 0.2s, transform 0.2s;
        }

        .tutorial-dot.active {
            background: var(--accent);
            transform: scale(1.3);
        }

        .tutorial-btn-row {
            display: flex;
            gap: 8px;
        }

        .tutorial-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 8px 16px;
            font-weight: 900;
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            min-height: 36px;
        }

        .tutorial-btn.secondary {
            background: transparent;
            color: var(--text);
            border: 2px solid var(--border);
            opacity: 0.7;
        }

        .tutorial-btn:active { opacity: 0.7; }
    </style>
</head>
<body data-theme="dark">

<!-- Settings backdrop (mobile only) -->
<div class="settings-backdrop" id="settingsBackdrop" onclick="closeSettings()"></div>

<header>
    <img id="mainLogo" src="https://raw.githubusercontent.com/ElliottC823/powerhouse/main/POWERHOUSE-dark.png" alt="Powerhouse" class="logo-img">
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search games..." oninput="renderGames()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="controls">
        <button class="settings-btn" onclick="toggleSettings()" aria-label="Settings">⚙</button>
    </div>
</header>

<div class="shelf-container" id="historyShelf">
    <div class="shelf-title">Continue playing</div>
    <div class="shelf-scroll" id="historyGrid"></div>
</div>

<div class="shelf-container" id="recommendedShelf">
    <div class="shelf-title">Recommended</div>
    <div class="shelf-scroll" id="recommendedGrid"></div>
</div>

<nav class="filter-bar" id="filterBar"></nav>

<main id="game-grid"></main>

<!-- Settings Panel -->
<div id="settingsMenu" class="settings-menu" role="dialog" aria-label="Settings">
    <span class="sheet-handle"></span>
    <div class="row"><span>DARK MODE</span><input type="checkbox" id="themeToggle" checked onclick="updateUI()"></div>
    <div class="row"><span>ROUNDED UI</span><input type="checkbox" id="cornerToggle" checked onclick="updateUI()"></div>
    <div class="row">
        <span>ACCENT</span>
        <div class="accent-controls">
            <button class="reset-accent-btn" onclick="resetAccent()" title="Reset to default">RESET</button>
            <input type="color" id="accentPicker" value="#0066FF" oninput="updateUI()">
        </div>
    </div>
    <div class="row"><span>HISTORY</span><button class="reset-btn" onclick="clearHistory()">CLEAR</button></div>
    <div class="row"><span>TUTORIAL</span><button class="reset-btn" style="background:#0066FF;" onclick="closeSettings(); startTutorial()">REDO</button></div>

    <div class="divider">
        <h4>About Powerhouse</h4>
        <p id="aboutText" class="small-text">Loading hub information...</p>
    </div>

    <div class="divider">
        <h4>Contributors</h4>
        <div class="contributor-list">
            <span>C823 (Lead Dev)</span>
            <span>Grandpa Joey</span>
            <span>Stein</span>
            <span>KC</span>
        </div>
    </div>

    <div class="divider">
        <h4>Mirrors</h4>
        <a href="https://powerhouse.c823.workers.dev/" class="mirror-link" onclick="loadInBlank('https://powerhouse.c823.workers.dev/'); return false;">Cloudflare (Main)</a>
        <a href="https://sites.google.com/view/powerhousehub/" class="mirror-link" onclick="loadInBlank('https://sites.google.com/view/powerhousehub/'); return false;">Google Sites</a>
    </div>

    <div style="font-size: 0.6rem; opacity: 0.5; margin-top: 15px; text-align: right;">V1.5.06</div>
</div>

<!-- Tutorial Overlay -->
<div class="tutorial-overlay" id="tutorialOverlay">
    <div class="tutorial-backdrop" id="tutorialBackdrop"></div>
    <div class="tutorial-highlight" id="tutorialHighlight"></div>
    <div class="tutorial-card" id="tutorialCard">
        <div class="tutorial-step-label" id="tutorialStepLabel"></div>
        <div class="tutorial-title" id="tutorialTitle"></div>
        <div class="tutorial-body" id="tutorialBody"></div>
        <div class="tutorial-actions">
            <div class="tutorial-dots" id="tutorialDots"></div>
            <div class="tutorial-btn-row">
                <button class="tutorial-btn secondary" id="tutorialSkip" onclick="endTutorial()">Skip</button>
                <button class="tutorial-btn" id="tutorialNext" onclick="tutorialNext()">Next</button>
            </div>
        </div>
    </div>
</div>

<script>
    let games = [];
    let currentFilter = 'ALL';

    const FAVICON_URL = 'https://raw.githubusercontent.com/ElliottC823/powerhouse/main/POWERHOUSE-icon.png';

    function loadInBlank(url, title, thumb) {
        if (url.includes('youtube.com') || url.includes('youtu.be')) {
            window.open(url, '_blank');
            return;
        }
        const displayTitle = title || 'Powerhouse';
        const gameLogo     = thumb || '';
        const tab = window.open('about:blank', '_blank');
        if (!tab) return;

        tab.document.write(`<!DOCTYPE html>
<html style="margin:0;padding:0;height:100%;width:100%;background:#13151b;">
<head>
  <title>${displayTitle}</title>
  <link rel="icon" type="image/png" href="${FAVICON_URL}">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { width:100%; height:100%; background:#13151b; font-family:'Outfit',sans-serif; overflow:hidden; }

    /* ── TOPBAR ── */
    #ph-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: #1e2028;
      border-bottom: 2px solid #35394a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 9999;
      gap: 12px;
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
      will-change: transform;
    }
    #ph-bar.hidden { transform: translateY(-100%); }

    /* Left side: PH logo + divider + game thumb + title */
    .ph-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .ph-logo-link { display:flex; align-items:center; flex-shrink:0; }
    .ph-logo {
      height: 26px;
      object-fit: contain;
      display: block;
    }

    .ph-divider {
      width: 1px;
      height: 28px;
      background: #35394a;
      flex-shrink: 0;
    }

    .ph-game-thumb {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid #35394a;
      flex-shrink: 0;
      display: ${gameLogo ? 'block' : 'none'};
    }

    .ph-game-title {
      font-size: 0.88rem;
      font-weight: 900;
      color: #f5f6fa;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    /* Right side: open direct button */
    .ph-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .ph-btn {
      background: #0066FF;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 6px 14px;
      font-size: 0.75rem;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
      min-height: 34px;
      white-space: nowrap;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: opacity 0.15s;
    }
    .ph-btn:hover { opacity: 0.85; }
    .ph-btn:active { opacity: 0.65; }

    /* Minimize button */
    .ph-minimize {
      background: transparent;
      border: 2px solid #35394a;
      color: #f5f6fa;
      border-radius: 10px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      flex-shrink: 0;
      transition: border-color 0.15s, opacity 0.15s;
    }
    .ph-minimize:hover { border-color: #0066FF; }
    .ph-minimize:active { opacity: 0.65; }

    /* ── RESTORE PILL — shown when bar is hidden ── */
    #ph-restore {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: #1e2028;
      border: 2px solid #35394a;
      border-radius: 20px;
      padding: 5px 14px 5px 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      z-index: 9999;
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #ph-restore.show { transform: translateX(-50%) translateY(0); }
    #ph-restore svg { width:14px; height:14px; fill:#f5f6fa; }
    #ph-restore span { font-size:0.72rem; font-weight:900; color:#f5f6fa; }

    /* ── IFRAME ── */
    #ph-wrap {
      position: absolute;
      top: 52px; left: 0; right: 0; bottom: 0;
      transition: top 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    #ph-wrap.expanded { top: 0; }

    #gameFrame {
      width: 100%; height: 100%;
      border: none; display: block;
    }

    /* ── BLOCKER ── */
    #blocker {
      display: none;
      position: fixed; inset: 0;
      background: #13151b; color: #f5f6fa;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; text-align: center; padding: 24px;
      z-index: 100;
    }
    #blocker.show { display: flex; }
    #blocker h2 { font-size: 1.3rem; }
    #blocker p  { font-size: 0.9rem; opacity: 0.6; max-width: 360px; line-height: 1.5; }
    #blocker a  {
      display: inline-block; margin-top: 8px;
      background: #0066FF; color: #fff; text-decoration: none;
      padding: 10px 24px; border-radius: 12px; font-weight: 700; font-size: 0.9rem;
    }
    #blocker a:hover { opacity: 0.85; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Topbar -->
  <div id="ph-bar">
    <div class="ph-left">
      <a href="https://powerhousemirrors.c823.workers.dev" target="_blank" rel="noopener" class="ph-logo-link">
        <img class="ph-logo" src="${FAVICON_URL}" alt="Powerhouse">
      </a>
      <div class="ph-divider"></div>
      <img class="ph-game-thumb" src="${gameLogo}" alt="" onerror="this.style.display='none'">
      <span class="ph-game-title">${displayTitle}</span>
    </div>

    <div class="ph-right">
      <a class="ph-btn" href="${url}" target="_blank" rel="noopener">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 11L11 1M11 1H4M11 1V8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Open directly
      </a>
      <button class="ph-minimize" id="minimizeBtn" title="Minimize" onclick="toggleBar()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 9L7 4L12 9" stroke="#f5f6fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Restore pill (visible when bar is hidden) -->
  <div id="ph-restore" onclick="toggleBar()">
    <svg viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 5L7 10L12 5" stroke="#f5f6fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <span>Powerhouse</span>
  </div>

  <!-- Game iframe -->
  <div id="ph-wrap">
    <iframe id="gameFrame" src="${url}" allowfullscreen></iframe>
  </div>

  <!-- Blocker fallback -->
  <div id="blocker">
    <h2>⚠️ Can't embed this game</h2>
    <p>This site blocks being loaded inside frames. You can open it directly instead.</p>
    <a href="${url}" target="_blank" rel="noopener">Open directly ↗</a>
  </div>

  <script>
    const bar     = document.getElementById('ph-bar');
    const wrap    = document.getElementById('ph-wrap');
    const restore = document.getElementById('ph-restore');
    const frame   = document.getElementById('gameFrame');
    const blocker = document.getElementById('blocker');
    let barVisible = true;

    function toggleBar() {
      barVisible = !barVisible;
      bar.classList.toggle('hidden', !barVisible);
      wrap.classList.toggle('expanded', !barVisible);
      restore.classList.toggle('show', !barVisible);
    }

    // Blocker / iframe load detection
    let loaded = false;
    frame.addEventListener('load', () => { loaded = true; });
    frame.addEventListener('error', () => {
      blocker.classList.add('show');
      frame.style.display = 'none';
    });
    setTimeout(() => {
      if (!loaded) {
        blocker.classList.add('show');
        frame.style.display = 'none';
      }
    }, 4000);
  <\/script>
</body>
</html>`);
        tab.document.close();
    }

    // Main entry point for opening a game.
    // Opening logic:
    //   useBlank: true  → always about:blank regardless of verified
    //   useBlank: false → always open directly regardless of verified (explicit opt-out)
    //   useBlank: null/undefined → fall back to verified flag (!verified = about:blank)
    function openGame(url, verified, title, useBlank, thumb, event) {
        if (event) event.preventDefault();
        let shouldUseBlank;
        if (useBlank === true) {
            shouldUseBlank = true;
        } else if (useBlank === false) {
            shouldUseBlank = false;
        } else {
            shouldUseBlank = !verified;
        }
        if (shouldUseBlank) {
            loadInBlank(url, title, thumb);
        } else {
            window.open(url, '_blank');
        }
    }

    async function fetchData() {
        try {
            const res = await fetch('https://raw.githubusercontent.com/ElliottC823/powerhouse/main/games.txt');
            games = await res.json();

            const aboutRes = await fetch('https://raw.githubusercontent.com/ElliottC823/powerhouse/main/about.txt');
            if (aboutRes.ok) document.getElementById('aboutText').innerText = await aboutRes.text();

            renderFilters();
            renderGames();
        } catch (e) { console.error("Load failed", e); }
    }
    // fetchData already returns a promise (async fn), so .then() works on it.

    function renderFilters() {
        const bar = document.getElementById('filterBar');
        const cats = ['ALL', 'UNBLOCKED', ...new Set(games.map(g => g.category.toUpperCase()))];
        bar.innerHTML = cats.map(c => `
            <button class="filter-btn ${currentFilter === c ? 'active' : ''}" 
                    onclick="setFilter('${c}')">${c}</button>
        `).join('');
    }

    function setFilter(cat) {
        currentFilter = cat;
        renderFilters();
        renderGames();
    }

    function trackPlay(game) {
        let history = JSON.parse(localStorage.getItem('power_history') || '[]');
        history = history.filter(g => g.title !== game.title);
        history.unshift(game);
        localStorage.setItem('power_history', JSON.stringify(history.slice(0, 8)));
    }

    function clearHistory() {
        localStorage.removeItem('power_history');
        renderGames();
    }

    function shelfItemHTML(g) {
        const safeTitle = g.title.replace(/'/g, "\'");
        const safeThumb = (g.thumb || '').replace(/'/g, "\'");
        return `<a href="${g.link}" class="shelf-item" onclick="trackPlay(${JSON.stringify(g).replace(/"/g, '&quot;')}); openGame('${g.link}', ${!!g.verified}, '${safeTitle}', ${!!g.useBlank}, '${safeThumb}', event)">
                    <img src="${g.thumb}" class="shelf-img" loading="lazy">
                    ${g.verified ? `<img src="https://raw.githubusercontent.com/ElliottC823/powerhouse/main/verified.svg" class="shelf-verified">` : ''}
                    <div class="shelf-label">${g.title}</div>
                </a>`;
    }

    function renderGames() {
        const grid = document.getElementById('game-grid');
        const search = document.getElementById('searchInput').value.toLowerCase();

        // Render History Shelf
        const history = JSON.parse(localStorage.getItem('power_history') || '[]');
        const shelf = document.getElementById('historyShelf');
        if (history.length > 0) {
            shelf.style.display = 'block';
            document.getElementById('historyGrid').innerHTML = history.map(g => shelfItemHTML(g)).join('');
        } else {
            shelf.style.display = 'none';
        }

        // Render Recommended Shelf — only when history exists
        const recommendedShelf = document.getElementById('recommendedShelf');
        if (history.length > 0 && games.length > 0) {
            // Collect categories from played games, deduplicated
            const playedTitles = new Set(history.map(g => g.title));
            const playedCategories = [...new Set(history.map(g => g.category))];

            // Find games in the same categories that haven't been played, shuffle lightly
            let pool = games.filter(g =>
                playedCategories.includes(g.category) && !playedTitles.has(g.title)
            );

            // If not enough category matches, pad with any unplayed games
            if (pool.length < 4) {
                const extras = games.filter(g => !playedTitles.has(g.title) && !pool.includes(g));
                pool = [...pool, ...extras];
            }

            // Deterministic shuffle using title chars so it's stable per session
            pool.sort((a, b) => {
                const seed = (s) => s.split('').reduce((acc, c) => acc + c.charCodeAt(0), 0);
                return (seed(a.title) % 7) - (seed(b.title) % 7);
            });

            const picks = pool.slice(0, 8);
            if (picks.length > 0) {
                recommendedShelf.style.display = 'block';
                document.getElementById('recommendedGrid').innerHTML = picks.map(g => shelfItemHTML(g)).join('');
            } else {
                recommendedShelf.style.display = 'none';
            }
        } else {
            recommendedShelf.style.display = 'none';
        }

        const filtered = games.filter(g => {
            const matchesSearch = g.title.toLowerCase().includes(search);
            let matchesFilter = false;
            if (currentFilter === 'ALL') {
                matchesFilter = true;
            } else if (currentFilter === 'UNBLOCKED') {
                matchesFilter = g.verified === true;
            } else {
                matchesFilter = g.category.toUpperCase() === currentFilter;
            }
            return matchesSearch && matchesFilter;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-state">No games found 🎮</div>`;
            return;
        }

        grid.innerHTML = filtered.map(g => `
            <a href="${g.link}" class="game-card" onclick="trackPlay(${JSON.stringify(g).replace(/"/g, '&quot;')}); openGame('${g.link}', ${!!g.verified}, '${g.title.replace(/'/g, "\\'")}', ${!!g.useBlank}, '${(g.thumb||'').replace(/'/g,"\\'")}', event)">
                <div class="thumb-wrap"><img src="${g.thumb}" class="thumb" loading="lazy" alt="${g.title}"></div>
                <div class="game-info">
                    <div class="game-title-container">
                        <div class="game-title">${g.title}</div>
                        ${g.verified ? `<img src="https://raw.githubusercontent.com/ElliottC823/powerhouse/main/verified.svg" class="verified-badge" title="Verified Unblocked">` : ''}
                    </div>
                    <div class="play-btn">PLAY</div>
                </div>
            </a>
        `).join('');
    }

    function toggleSettings() {
        const menu = document.getElementById('settingsMenu');
        const backdrop = document.getElementById('settingsBackdrop');
        const isOpen = menu.classList.contains('show');
        if (isOpen) {
            closeSettings();
        } else {
            menu.classList.add('show');
            backdrop.classList.add('show');
        }
    }

    function closeSettings() {
        document.getElementById('settingsMenu').classList.remove('show');
        document.getElementById('settingsBackdrop').classList.remove('show');
    }

    function loadSettings() {
        // Read all saved preferences from localStorage and apply to controls
        const theme   = localStorage.getItem('power_theme') || 'dark';
        const corners = localStorage.getItem('power_corners') || 'rounded';
        const accent  = localStorage.getItem('power_accent') || '#0066FF';


        document.getElementById('themeToggle').checked    = (theme === 'dark');
        document.getElementById('cornerToggle').checked   = (corners === 'rounded');
        document.getElementById('accentPicker').value     = accent;
    }

    function updateUI() {
        const isDark    = document.getElementById('themeToggle').checked;
        const isRounded = document.getElementById('cornerToggle').checked;
        const accent    = document.getElementById('accentPicker').value;

        document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
        document.body.setAttribute('data-corners', isRounded ? 'rounded' : 'sharp');
        document.documentElement.style.setProperty('--accent', accent);

        const logo = document.getElementById('mainLogo');
        logo.src = isDark
            ? "https://raw.githubusercontent.com/ElliottC823/powerhouse/main/POWERHOUSE-dark.png"
            : "https://raw.githubusercontent.com/ElliottC823/powerhouse/main/POWERHOUSE-light.png";

        // Save all preferences
        localStorage.setItem('power_theme',        isDark ? 'dark' : 'light');
        localStorage.setItem('power_corners',       isRounded ? 'rounded' : 'sharp');
        localStorage.setItem('power_accent',        accent);
    }

    // Close settings on outside click (desktop only — backdrop handles mobile)
    window.onclick = (e) => {
        const menu = document.getElementById('settingsMenu');
        if (
            menu.classList.contains('show') &&
            !e.target.closest('.settings-menu') &&
            !e.target.closest('.settings-btn') &&
            window.innerWidth >= 600
        ) {
            closeSettings();
        }
    };

    // Keyboard: close settings on Escape
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeSettings();
    });

    function resetAccent() {
        const defaultAccent = '#0066FF';
        document.getElementById('accentPicker').value = defaultAccent;
        updateUI();
    }


    // ── TUTORIAL ──
    const TUTORIAL_STEPS = [
        {
            title: "Welcome to Powerhouse! 👋",
            body: "This quick tour will walk you through everything. Tap Next to get started, or Skip to jump right in.",
            target: null, // no highlight for welcome card
            position: 'center'
        },
        {
            title: "Search Games 🔍",
            body: "Type any game name here to instantly filter the library. Results update as you type.",
            target: '#searchInput',
            position: 'below'
        },
        {
            title: "Filter by Category 🗂️",
            body: "Tap a category pill to browse by type — Arcade, Puzzle, Media, Hub, and more. The UNBLOCKED filter shows only verified games.",
            target: '#filterBar',
            position: 'below'
        },
        {
            title: "Game Cards 🎮",
            body: "Click any card to launch the game. Verified games (✔ badge) are confirmed unblocked. Non-verified games open via about:blank for extra privacy.",
            target: '#game-grid',
            position: 'above'
        },
        {
            title: "Continue Playing ▶️",
            body: "Once you've played a game it appears here for quick access. Your history is saved locally and never leaves your device.",
            target: '#historyShelf',
            position: 'below',
            showOnlyIfVisible: true,
            fallbackBody: "Once you've played a game, a Continue Playing shelf will appear here for quick access. Your history is saved locally."
        },
        {
            title: "Recommended 🌟",
            body: "Based on what you've played, Powerhouse suggests similar games here. The more you play, the better it gets.",
            target: '#recommendedShelf',
            position: 'below',
            showOnlyIfVisible: true,
            fallbackBody: "After playing a few games, a Recommended shelf will appear with suggestions based on your taste."
        },
        {
            title: "Settings ⚙️",
            body: "Tap this button to open settings — switch dark/light mode, toggle rounded corners, change the accent color, manage history, and more.",
            target: '.settings-btn',
            position: 'below-left'
        },
        {
            title: "You're all set! 🚀",
            body: "That's everything! If you ever want to see this tour again, tap REDO TUTORIAL in Settings. Enjoy Powerhouse!",
            target: null,
            position: 'center'
        }
    ];

    let tutorialStep = 0;

    function startTutorial() {
        tutorialStep = 0;
        document.getElementById('tutorialOverlay').classList.add('active');
        renderTutorialStep();
    }

    function endTutorial() {
        document.getElementById('tutorialOverlay').classList.remove('active');
        clearHighlight();
        localStorage.setItem('power_tutorial_done', 'true');
    }

    function tutorialNext() {
        tutorialStep++;
        if (tutorialStep >= TUTORIAL_STEPS.length) {
            endTutorial();
            return;
        }
        renderTutorialStep();
    }

    function clearHighlight() {
        const hl = document.getElementById('tutorialHighlight');
        hl.style.opacity = '0';
        hl.style.width = '0';
        hl.style.height = '0';
    }

    function renderTutorialStep() {
        const step = TUTORIAL_STEPS[tutorialStep];
        const isLast = tutorialStep === TUTORIAL_STEPS.length - 1;

        // Dots
        const dots = document.getElementById('tutorialDots');
        dots.innerHTML = TUTORIAL_STEPS.map((_, i) =>
            `<div class="tutorial-dot ${i === tutorialStep ? 'active' : ''}"></div>`
        ).join('');

        // Step label
        document.getElementById('tutorialStepLabel').textContent =
            `Step ${tutorialStep + 1} of ${TUTORIAL_STEPS.length}`;

        // Content — handle fallback for hidden shelves
        let body = step.body;
        if (step.showOnlyIfVisible && step.target) {
            const el = document.querySelector(step.target);
            if (!el || el.style.display === 'none') {
                body = step.fallbackBody || step.body;
                // No highlight if element isn't visible
                clearHighlight();
                positionCard(null, step.position);
                document.getElementById('tutorialTitle').textContent = step.title;
                document.getElementById('tutorialBody').textContent = body;
                document.getElementById('tutorialNext').textContent = isLast ? 'Finish 🎉' : 'Next';
                return;
            }
        }

        document.getElementById('tutorialTitle').textContent = step.title;
        document.getElementById('tutorialBody').textContent = body;
        document.getElementById('tutorialNext').textContent = isLast ? 'Finish 🎉' : 'Next';

        // Highlight
        const hl = document.getElementById('tutorialHighlight');
        if (step.target) {
            const el = document.querySelector(step.target);
            if (el) {
                const r = el.getBoundingClientRect();
                const pad = 6;
                hl.style.opacity = '1';
                hl.style.left   = (r.left - pad) + 'px';
                hl.style.top    = (r.top - pad) + 'px';
                hl.style.width  = (r.width + pad * 2) + 'px';
                hl.style.height = (r.height + pad * 2) + 'px';
                positionCard(el, step.position);
            } else {
                clearHighlight();
                positionCard(null, step.position);
            }
        } else {
            clearHighlight();
            positionCard(null, step.position);
        }
    }

    function positionCard(targetEl, position) {
        const card = document.getElementById('tutorialCard');
        const cardW = 300;
        const cardH = 200; // approx
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const margin = 16;

        if (!targetEl || position === 'center') {
            card.style.left = Math.max(margin, (vw - cardW) / 2) + 'px';
            card.style.top  = Math.max(margin, (vh - cardH) / 2) + 'px';
            card.style.bottom = 'auto';
            return;
        }

        const r = targetEl.getBoundingClientRect();

        if (position === 'below' || position === 'below-left') {
            let top = r.bottom + 16;
            // If it would overflow bottom, flip above
            if (top + cardH > vh - margin) top = r.top - cardH - 16;
            card.style.top    = Math.max(margin, top) + 'px';
            card.style.bottom = 'auto';

            if (position === 'below-left') {
                // Align card right edge with target right edge
                let left = r.right - cardW;
                card.style.left = Math.max(margin, Math.min(left, vw - cardW - margin)) + 'px';
            } else {
                let left = r.left;
                card.style.left = Math.max(margin, Math.min(left, vw - cardW - margin)) + 'px';
            }
        } else if (position === 'above') {
            let top = r.top - cardH - 16;
            if (top < margin) top = r.bottom + 16;
            card.style.top    = Math.max(margin, top) + 'px';
            card.style.bottom = 'auto';
            let left = r.left;
            card.style.left = Math.max(margin, Math.min(left, vw - cardW - margin)) + 'px';
        }
    }

    window.onload = () => {
        loadSettings(); // Restore saved prefs into controls first
        updateUI();     // Apply them to the UI
        fetchData().then(() => {
            // Show tutorial automatically on first visit
            if (!localStorage.getItem('power_tutorial_done')) {
                setTimeout(startTutorial, 800);
            }
        });
    };
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C823 - games and stuff</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/225702018?v=4">
    <!-- Authentic font used by neal.fun -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f7f7;
            --text-color: #222;
            --card-bg: white;
            --card-border: #222;
            --button-bg: white;
            --active-bg: #4a90e2;
            --shadow-color: #222;
        }

        .contributor-chip a {
  color: var(--accent);
  text-decoration: none;
}

.contributor-chip a:hover {
  text-decoration: underline;
}

        
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #181818; /* Matched to user reference image */
                --text-color: #f1f1f1;
                --card-bg: #212121; /* Matched to user reference image element box */
                --card-border: #f1f1f1;
                --button-bg: #212121;
                --active-bg: #4a90e2;
                --shadow-color: #f1f1f1;
            }
        }

        body {
            font-family: 'Comfortaa', cursive, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Header Section Animations */
        header {
            text-align: center;
            margin-top: 50px;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: -1px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .avatar-o {
            width: 40px;
            height: 40px;
            border: 2.5px solid var(--card-border);
            border-radius: 50%;
            display: inline-block;
            vertical-align: middle;
            object-fit: cover;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .avatar-o:hover {
            transform: rotate(15deg) scale(1.1);
        }

        p.subtitle {
            font-size: 1.1rem;
            color: inherit;
            opacity: 0.7;
            margin-top: 8px;
            font-weight: 400;
            animation: fadeIn 1s ease 0.2s backwards;
        }

        /* Category Nav */
        .category-nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s backwards;
        }

        .category-btn {
            font-family: 'Comfortaa', cursive;
            background: var(--button-bg);
            color: var(--text-color);
            border: 2.5px solid var(--card-border);
            padding: 8px 18px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--shadow-color);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, background-color 0.2s, color 0.2s;
        }

        .category-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 5px 6px 0px var(--shadow-color);
        }

        .category-btn:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 2px 2px 0px var(--shadow-color);
        }

        .category-btn.active {
            background: var(--active-bg);
            color: #ffffff;
            border-color: var(--card-border);
        }

        /* Grid Layout & Sections */
        .container {
            max-width: 1100px;
            width: 90%;
            margin-bottom: 40px;
        }

        .category-section {
            margin-bottom: 50px;
            animation: fadeIn 0.6s ease-out backwards;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            border-bottom: 2.5px solid var(--card-border);
            padding-bottom: 8px;
            display: inline-block;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -2.5px;
            left: 0;
            width: 100%;
            height: 2.5px;
            background-color: var(--active-bg);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .category-section:hover .section-title::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        /* Card Styling - Full Image Card layout with smooth entrance animation */
        .card {
            background-color: var(--card-bg);
            border: 2.5px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 4px 4px 0px var(--shadow-color);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 180px;
            position: relative;
            animation: cardEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }

        .card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 8px 10px 0px var(--shadow-color);
        }

        .card:active {
            transform: translateY(-2px) scale(0.99);
            box-shadow: 4px 5px 0px var(--shadow-color);
        }

        .card-image-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background-color: #4a90e2;
        }

        .card-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), filter 0.3s ease;
        }

        .card:hover .card-image-container img {
            transform: scale(1.08);
            filter: brightness(1.05);
        }

        /* Tag Styling */
        .card-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: var(--active-bg);
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
            border: 2px solid var(--card-border);
            z-index: 2;
            box-shadow: 2px 2px 0px var(--shadow-color);
            letter-spacing: 0.5px;
        }

        /* Disclaimer Footer */
        .disclaimer-footer {
            width: 100%;
            text-align: center;
            padding: 30px 20px;
            margin-bottom: 40px;
            font-size: 0.85rem;
            opacity: 0.6;
            animation: fadeIn 1s ease 0.4s backwards;
        }

        /* Keyframe Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <h1>C823<img src="https://avatars.githubusercontent.com/u/225702018?v=4" alt="Avatar" class="avatar-o"></h1>
        </div>
        <p class="subtitle">games and stuff</p>
    </header>

    <div id="categoryNav" class="category-nav"></div>

    <main id="mainContainer" class="container"></main>

    <footer class="disclaimer-footer">
        I am not responsible for anything done with the sites listed on the website.
    </footer>

    <script>
        // ==========================================
        // ADD / EDIT YOUR ITEMS & CATEGORIES HERE
        // Available tags: "NEW", "WIP", "ARCHIVE", or leave blank for none
        // ==========================================
        const siteData = {
            categories: [
                { id: "all", name: "All Stuff" },
                { id: "projects", name: "Projects" },
                { id: "github", name: "GitHub" },
                { id: "collaborations", name: "Collaborations" }
            ],
            items: [
                {
                    title: "Powerhouse",
                    category: "projects",
                    url: "https://powerhouse.c823.workers.dev",
                    image: "https://raw.githubusercontent.com/ElliottC823/Powerhouse/main/banner.png",
                    tag: "NEW"
                },
                {
                    title: "LockedIn",
                    category: "projects",
                    url: "https://lockedin.c1120.workers.dev",
                    image: "",
                    tag: "WIP"
                },
                {
                    title: "LockedIn (GitHub)",
                    category: "github",
                    url: "https://github.com/ElliottC823/LockedIn",
                    image: "",
                    tag: "WIP"
                },
                {
                    title: "FireTube",
                    category: "github",
                    url: "https://github.com/ElliottC823/FireTube",
                    image: "",
                    tag: "ARCHIVE"
                },
                {
                    title: "Fetch",
                    category: "github",
                    url: "https://github.com/ElliottC823/Fetch",
                    image: "https://raw.githubusercontent.com/ElliottC823/Fetch/main/banner.png",
                    tag: ""
                },
                {
                    title: "Powerhouse (GitHub)",
                    category: "github",
                    url: "https://github.com/ElliottC823/Powerhouse",
                    image: "https://raw.githubusercontent.com/ElliottC823/Powerhouse/main/banner.png",
                    tag: ""
                },
                {
                    title: "Uncle Joe's Guardian",
                    category: "collaborations",
                    url: "https://uncle-joes-guardian-production.up.railway.app/",
                    image: "",
                    tag: "WIP"
                },
                {
                    title: "WL Bets",
                    category: "collaborations",
                    url: "https://wlbets.lovable.app/",
                    image: "",
                    tag: "NEW"
                },
                {
                    title: "Uncle's AI",
                    category: "collaborations",
                    url: "https://unclesai.lovable.app/",
                    image: "",
                    tag: "WIP"
                }
            ]
        };

        const defaultImage = "https://upload.wikimedia.org/wikipedia/commons/6/60/No-Image-Placeholder-banner.svg";
        let currentFilter = 'all';

        function renderApp() {
            const navContainer = document.getElementById('categoryNav');
            const mainContainer = document.getElementById('mainContainer');

            navContainer.innerHTML = siteData.categories.map(cat => `
                <button class="category-btn ${currentFilter === cat.id ? 'active' : ''}" onclick="filterCategory('${cat.id}')">
                    ${cat.name}
                </button>
            `).join('');

            if (currentFilter === 'all') {
                let htmlContent = '';
                siteData.categories.filter(c => c.id !== 'all').forEach((cat, index) => {
                    const catItems = siteData.items
                        .filter(item => item.category === cat.id)
                        .sort((a, b) => a.title.localeCompare(b.title));

                    if (catItems.length > 0) {
                        htmlContent += `
                            <div class="category-section" style="animation-delay: ${index * 0.1}s">
                                <h2 class="section-title">${cat.name}</h2>
                                <div class="grid">
                                    ${catItems.map((item, itemIndex) => createCardHtml(item, itemIndex)).join('')}
                                </div>
                            </div>
                        `;
                    }
                });
                mainContainer.innerHTML = htmlContent;
            } else {
                const activeCat = siteData.categories.find(c => c.id === currentFilter);
                const filteredItems = siteData.items
                    .filter(item => item.category === currentFilter)
                    .sort((a, b) => a.title.localeCompare(b.title));

                mainContainer.innerHTML = `
                    <div class="category-section">
                        <h2 class="section-title">${activeCat ? activeCat.name : ''}</h2>
                        <div class="grid">
                            ${filteredItems.length > 0 ? filteredItems.map((item, itemIndex) => createCardHtml(item, itemIndex)).join('') : '<p style="opacity:0.6;">No items found here yet!</p>'}
                        </div>
                    </div>
                `;
            }
        }

        function createCardHtml(item, index) {
            const tagHtml = (item.tag && item.tag.trim() !== "") ? `<div class="card-tag">${item.tag}</div>` : '';
            
            return `
                <a href="${item.url}" class="card" target="_blank" style="animation-delay: ${index * 0.05}s">
                    ${tagHtml}
                    <div class="card-image-container">
                        <img src="${item.image && item.image.trim() !== "" ? item.image : defaultImage}" 
                             alt="${item.title} preview" 
                             loading="lazy" 
                             onerror="this.onerror=null;this.src='${defaultImage}';">
                    </div>
                </a>
            `;
        }

        function filterCategory(catId) {
            currentFilter = catId;
            renderApp();
        }

        renderApp();
    </script>
</body>
</html>

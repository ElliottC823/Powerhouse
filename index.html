<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Powerhouse</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link id="fontLink" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');

        :root {
            --accent:    #4d7fff;
            --accent2:  #2f5fe0;
            --accent-light: rgba(77,127,255,0.10);
            --accent-glow: rgba(77,127,255,0.22);
            --radius:    14px;
            --radius-sm: 10px;
            --radius-xs: 7px;
            --header-height: 48px;
            --font: 'Outfit', sans-serif;
            --font-weight-normal: 400;
            --font-weight-bold: 600;
            --font-weight-black: 700;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-snap: cubic-bezier(0.34, 1.56, 0.64, 1);

            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.16), 0 2px 8px rgba(0,0,0,0.08);

            --tracking-tight: -0.01em;
            --tracking-wide: 0.02em;

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        /* ── CONTRIBUTOR CHIP FIX ── */
        .contributor-chip a {
            color: var(--accent);
            text-decoration: none;
        }
        .contributor-chip a:hover {
            text-decoration: underline;
        }

        /* ── THEMES ── */
        [data-theme="dark"] {
            --bg: #0a0b10; --bg-gradient: linear-gradient(180deg, #0d0e15 0%, #0a0b10 100%);
            --header-gradient: #0d0e14;
            --surface: #131419; --surface2: #191b22; --text: #f4f5f9;
            --text-muted: rgba(244,245,249,0.48); --border: rgba(255,255,255,0.06);
            --shadow: 0 4px 20px rgba(0,0,0,0.4); --logo: dark;
        }
        /* ── Light theme ── */
        [data-theme="light"] {
            --bg: #f6f7fb; --bg-gradient: linear-gradient(180deg, #ffffff 0%, #f6f7fb 100%);
            --header-gradient: #ffffff;
            --surface: #fff; --surface2: #f2f3f8; --text: #14151f;
            --text-muted: rgba(20,21,31,0.46); --border: rgba(20,21,31,0.08);
            --shadow: 0 4px 20px rgba(30,32,60,0.06); --logo: light;
        }



        /* ── Windows 7 Aero ── */
        [data-theme="aero"] {
            --bg:            #0f4b9c;
            --bg-gradient:     linear-gradient(180deg,#1975d2 0%,#1461b8 25%,#0c3d87 55%,#0a2e6e 100%);
            --header-gradient: linear-gradient(180deg,#4d9cf0 0%,#2e86f0 18%,#1a6be0 45%,#1458c8 55%,#1050b8 100%);
            --surface:           rgba(255,255,255,0.10);
            --surface2:          rgba(255,255,255,0.15);
            --text:              #ffffff;
            --text-muted:        rgba(255,255,255,0.6);
            --border:            rgba(255,255,255,0.22);
            --shadow:            0 2px 8px rgba(0,0,0,0.45);
            --accent:            #59b0f7;
            --accent2:           #3a9ef5;
            --accent-light:    rgba(89,176,247,0.2);
            --radius:            3px;
            --radius-sm:         2px;
            --radius-xs:         2px;
            --logo:              dark;
            --theme-accent-locked: 1;
        }

        /* Aero glass titlebar */
        [data-theme="aero"] header {
            background: linear-gradient(180deg,
                rgba(150,210,255,0.55) 0%,
                rgba(80,160,255,0.45) 30%,
                rgba(30,100,230,0.70) 55%,
                rgba(10,60,180,0.90) 100%) !important;
            border-bottom: 1px solid rgba(100,180,255,0.5) !important;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.5),
                inset 0 -1px 0 rgba(0,0,80,0.3),
                0 2px 6px rgba(0,0,60,0.5) !important;
            backdrop-filter: blur(20px) saturate(1.8);
            -webkit-backdrop-filter: blur(20px) saturate(1.8);
        }

        /* Aero glass cards */
        [data-theme="aero"] .game-card {
            background: linear-gradient(180deg,
                rgba(255,255,255,0.18) 0%,
                rgba(160,200,255,0.10) 50%,
                rgba(80,140,240,0.08) 100%) !important;
            border: 1px solid rgba(255,255,255,0.3) !important;
            border-radius: 3px !important;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.35),
                0 2px 6px rgba(0,0,60,0.4) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        [data-theme="aero"] .game-card:hover {
            background: linear-gradient(180deg,
                rgba(255,255,255,0.28) 0%,
                rgba(180,220,255,0.18) 50%,
                rgba(100,160,255,0.12) 100%) !important;
            border-color: rgba(255,255,255,0.5) !important;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.5),
                0 4px 12px rgba(0,0,80,0.45),
                0 0 0 1px rgba(100,180,255,0.4) !important;
        }

        /* Aero glass panels */
        [data-theme="aero"] .settings-menu,
        [data-theme="aero"] .acct-modal,
        [data-theme="aero"] .blog-panel,
        [data-theme="aero"] .gotw-card {
            background: linear-gradient(160deg,
                rgba(220,235,255,0.15) 0%,
                rgba(100,160,255,0.08) 100%) !important;
            border: 1px solid rgba(255,255,255,0.28) !important;
            border-radius: 6px !important;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.3),
                0 8px 32px rgba(0,0,60,0.55) !important;
            backdrop-filter: blur(20px) saturate(1.6);
            -webkit-backdrop-filter: blur(20px) saturate(1.6);
        }

        /* Win7 taskbar-style filter bar */
        [data-theme="aero"] nav.filter-bar {
            background: linear-gradient(180deg,
                rgba(80,150,240,0.5) 0%,
                rgba(30,90,200,0.65) 100%) !important;
            border-bottom: 1px solid rgba(100,160,255,0.4) !important;
            box-shadow: inset 0 1px 0 rgba(200,230,255,0.25) !important;
        }
        [data-theme="aero"] .filter-btn {
            border-radius: 2px !important;
            color: rgba(255,255,255,0.75) !important;
        }
        [data-theme="aero"] .filter-btn.active,
        [data-theme="aero"] .filter-btn:hover {
            background: linear-gradient(180deg,
                rgba(200,225,255,0.5) 0%,
                rgba(120,180,255,0.45) 48%,
                rgba(60,120,230,0.55) 52%,
                rgba(30,80,200,0.65) 100%) !important;
            border: 1px solid rgba(180,220,255,0.55) !important;
            color: #fff !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 1px 4px rgba(0,0,60,0.3) !important;
        }

        /* Win7 Aero buttons — the classic 4-stop gradient */
        [data-theme="aero"] .s-btn,
        [data-theme="aero"] .acct-btn-primary,
        [data-theme="aero"] .blog-submit-btn,
        [data-theme="aero"] .acct-action-btn,
        [data-theme="aero"] .acct-nav-tab.active {
            background: linear-gradient(180deg,
                #daeeff 0%,
                #b8ddff 45%,
                #5aaaf0 50%,
                #3d8de0 100%) !important;
            border: 1px solid #2369c0 !important;
            border-bottom-color: #1a50a0 !important;
            color: #00264d !important;
            text-shadow: 0 1px 0 rgba(255,255,255,0.7) !important;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.8),
                0 1px 3px rgba(0,0,80,0.35) !important;
            border-radius: 3px !important;
            font-family: 'Segoe UI', Tahoma, sans-serif !important;
        }
        [data-theme="aero"] .s-btn:hover,
        [data-theme="aero"] .acct-btn-primary:hover,
        [data-theme="aero"] .acct-action-btn:hover {
            background: linear-gradient(180deg,
                #e8f4ff 0%,
                #cce8ff 45%,
                #70c0ff 50%,
                #50a0f0 100%) !important;
        }
        [data-theme="aero"] .s-btn.danger,
        [data-theme="aero"] .acct-action-btn.danger {
            background: linear-gradient(180deg,#ffd5d0 0%,#ffb3ac 45%,#e84040 50%,#c02020 100%) !important;
            border-color: #9b1a1a !important;
            color: #fff !important;
            text-shadow: 0 -1px 0 rgba(0,0,0,0.4) !important;
        }

        /* Win7 font */
        [data-theme="aero"],
        [data-theme="aero"] * {
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif !important;
        }

        /* Shelf background */
        [data-theme="aero"] .shelf-container {
            background: rgba(0,0,0,0.15) !important;
            border: 1px solid rgba(255,255,255,0.15) !important;
            backdrop-filter: blur(8px);
        }

        /* Win7 scrollbar */
        [data-theme="aero"] ::-webkit-scrollbar-track { background: rgba(0,0,80,0.3); }
        [data-theme="aero"] ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #6aabf0, #2d6fd0);
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* Input fields */
        [data-theme="aero"] input,
        [data-theme="aero"] textarea,
        [data-theme="aero"] select {
            background: rgba(255,255,255,0.15) !important;
            border: 1px solid rgba(255,255,255,0.35) !important;
            border-top-color: rgba(0,0,0,0.25) !important;
            box-shadow: inset 0 2px 4px rgba(0,0,60,0.3) !important;
            color: #fff !important;
            border-radius: 2px !important;
        }
        [data-theme="aero"] input::placeholder,
        [data-theme="aero"] textarea::placeholder { color: rgba(255,255,255,0.45) !important; }
        [data-theme="aero"] input:focus,
        [data-theme="aero"] textarea:focus {
            border-color: rgba(100,180,255,0.8) !important;
            box-shadow: inset 0 2px 4px rgba(0,0,60,0.3), 0 0 0 2px rgba(80,160,255,0.35) !important;
        }

        .custom-swatch { overflow: hidden; }
        .locked-swatch { opacity: 0.6; }
        .locked-swatch:hover { opacity: 0.85; }

        [data-corners="sharp"] { --radius: 0px !important; --radius-sm: 0px !important; --radius-xs: 0px !important; }
        [data-corners="sharp"] *, [data-corners="sharp"] *::before, [data-corners="sharp"] *::after { border-radius: 0 !important; }

        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
        *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { background-color: var(--bg); }

        body {
            font-family: var(--font);
            background: var(--bg-gradient);
            background-color: var(--bg);
            color: var(--text);
            margin: 0; min-height: 100vh; overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-left: var(--safe-left);
            padding-right: var(--safe-right);
            padding-bottom: var(--safe-bottom);
            transition: background 0.2s, color 0.2s;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* ── MICA NOISE LAYER — authentic W11 texture ── */
        body::after {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.022;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Modern global scrollbar ── */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text) 18%, transparent); border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--accent) 45%, transparent); }
        * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--text) 18%, transparent) transparent; }

        /* ══ SIDEBAR LAYOUT ══════════════════════════════════════════════════ */
        :root { --sidebar-width: 220px; --sidebar-bar-size: 68px; --sidebar-offset-left: var(--sidebar-width); }
        @media (min-width: 681px) {
            [data-sidebar-pos="top"],
            [data-sidebar-pos="right"],
            [data-sidebar-pos="bottom"] { --sidebar-offset-left: 0px; }
        }

        /* ── Sidebar (fixed left) ── */
        #sidebar {
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: var(--sidebar-width);
            background: var(--header-gradient);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 900;
            overflow: hidden;
            transition: box-shadow 0.2s var(--ease);
        }
        .sidebar-brand {
            padding: 26px 18px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            display: flex; justify-content: center; align-items: center;
        }
        .sidebar-logo { height: 30px; object-fit: contain; display: block; max-width: 80%; }

        .sidebar-nav { padding: 14px 12px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; }
        .sidebar-nav-btn {
            display: flex; align-items: center; gap: 12px;
            width: 100%; padding: 10px 14px;
            background: none; border: none; border-radius: var(--radius-sm);
            color: var(--text-muted); font-family: inherit;
            font-size: 0.85rem; font-weight: 500;
            cursor: pointer; text-align: left;
            position: relative;
            transition: background 0.18s var(--ease), color 0.18s var(--ease), transform 0.18s var(--ease);
        }
        .sidebar-nav-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
        .sidebar-nav-btn:hover { background: color-mix(in srgb, var(--text) 6%, transparent); color: var(--text); transform: translateX(2px); }
        .sidebar-nav-btn.active {
            background: var(--accent-light);
            color: var(--accent); font-weight: 700;
        }
        .sidebar-nav-btn.active::before {
            content: ''; position: absolute; left: -12px; top: 50%; transform: translateY(-50%);
            width: 3px; height: 60%; border-radius: 0 4px 4px 0;
            background: var(--accent);
        }
        .nav-notif {
            margin-left: auto; background: var(--accent); color: #fff;
            font-size: 0.55rem; font-weight: 700; min-width: 16px; height: 16px;
            border-radius: 8px; display: inline-flex; align-items: center;
            justify-content: center; padding: 0 4px;
            box-shadow: var(--shadow-xs);
        }

        .sidebar-spacer { flex: 1; }

        .sidebar-bottom { padding: 14px 12px; border-top: 1px solid var(--border); flex-shrink: 0; }
        .sidebar-acct-btn {
            display: flex; align-items: center; gap: 12px;
            width: 100%; padding: 8px 10px;
            background: none; border: none; border-radius: var(--radius-sm);
            color: var(--text-muted); font-family: inherit;
            font-size: 0.88rem; font-weight: 600;
            cursor: pointer; text-align: left;
            transition: background 0.15s var(--ease), color 0.15s var(--ease);
        }
        .sidebar-acct-btn:hover { background: color-mix(in srgb, var(--text) 6%, transparent); color: var(--text); }
        .sidebar-acct-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--accent); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; font-weight: 700; flex-shrink: 0; overflow: hidden;
            box-shadow: var(--shadow-xs);
        }
        .sidebar-acct-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .sidebar-acct-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sidebar-search-slot { display: none; }

        /* ── Main content (offset by sidebar) ── */
        #main-content {
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ══ SIDEBAR POSITION SETTING (desktop only — mobile always uses the drawer) ══ */
        @media (min-width: 681px) {

            #sidebar { box-shadow: 4px 0 24px rgba(0,0,0,0.10); transition: box-shadow 0.2s var(--ease); }

            /* ── TOP ── */
            [data-sidebar-pos="top"] #sidebar {
                left: 0; right: 0; top: 0; bottom: auto;
                width: 100%; height: var(--sidebar-bar-size);
                flex-direction: row; align-items: center;
                border-right: none; border-bottom: 1px solid var(--border);
                box-shadow: 0 4px 24px rgba(0,0,0,0.14);
            }
            [data-sidebar-pos="top"] .sidebar-brand { padding: 0 18px; border-bottom: none; border-right: 1px solid var(--border); height: 100%; flex-shrink: 0; }
            [data-sidebar-pos="top"] .sidebar-nav { flex-direction: row; align-items: center; padding: 0 6px; flex-shrink: 1; overflow-x: auto; overflow-y: hidden; height: 100%; }
            [data-sidebar-pos="top"] .sidebar-nav-btn { width: auto; flex-shrink: 0; white-space: nowrap; }
            [data-sidebar-pos="top"] .sidebar-nav-btn:hover { transform: translateY(-1px); }
            [data-sidebar-pos="top"] .sidebar-nav-btn.active::before {
                left: 50%; top: auto; bottom: -2px; transform: translateX(-50%);
                width: 60%; height: 3px; border-radius: 4px 4px 0 0;
            }
            [data-sidebar-pos="top"] .sidebar-spacer { flex: 1; }
            [data-sidebar-pos="top"] .sidebar-search-slot {
                display: flex; align-items: center; height: 100%;
                padding: 0 12px; flex-shrink: 0; width: min(320px, 30vw);
                border-left: 1px solid var(--border);
            }
            [data-sidebar-pos="top"] .sidebar-search-slot .search-container { width: 100%; max-width: none; }
            [data-sidebar-pos="top"] #topbar { display: none; }
            [data-sidebar-pos="top"] .sidebar-bottom { border-top: none; border-left: 1px solid var(--border); padding: 0 14px; height: 100%; display: flex; align-items: center; flex-shrink: 0; }
            [data-sidebar-pos="top"] .sidebar-acct-btn { width: auto; }
            [data-sidebar-pos="top"] #main-content { margin-left: 0; margin-top: var(--sidebar-bar-size); }
            [data-sidebar-pos="top"] #topbar { top: var(--sidebar-bar-size); }
            [data-sidebar-pos="top"] .settings-backdrop { left: 0; top: var(--sidebar-bar-size); }
            [data-sidebar-pos="top"] .settings-menu {
                left: 0 !important; right: 0 !important; top: var(--sidebar-bar-size) !important;
                width: 340px; max-height: calc(100vh - var(--sidebar-bar-size)) !important; min-height: 0 !important;
                border-right: 1px solid var(--border) !important;
                box-shadow: 0 12px 40px rgba(0,0,0,0.3) !important;
            }

            /* ── RIGHT ── */
            [data-sidebar-pos="right"] #sidebar {
                left: auto; right: 0;
                border-right: none; border-left: 1px solid var(--border);
                box-shadow: -4px 0 24px rgba(0,0,0,0.14);
            }
            [data-sidebar-pos="right"] #main-content { margin-left: 0; margin-right: var(--sidebar-width); }
            [data-sidebar-pos="right"] .sidebar-nav-btn.active::before {
                left: auto; right: -12px; border-radius: 4px 0 0 4px;
            }
            [data-sidebar-pos="right"] .sidebar-nav-btn:hover { transform: translateX(-2px); }
            [data-sidebar-pos="right"] .settings-backdrop { left: 0; right: var(--sidebar-width); }
            [data-sidebar-pos="right"] .settings-menu {
                left: auto !important; right: var(--sidebar-width) !important;
                border-right: none !important; border-left: 1px solid var(--border) !important;
                box-shadow: -4px 0 32px rgba(0,0,0,0.35) !important;
                transform: translateX(100%);
            }
            [data-sidebar-pos="right"] .settings-menu.show { transform: translateX(0); }

            /* ── BOTTOM ── */
            [data-sidebar-pos="bottom"] #sidebar {
                left: 0; right: 0; top: auto; bottom: 0;
                width: 100%; height: var(--sidebar-bar-size);
                flex-direction: row; align-items: center;
                border-right: none; border-top: 1px solid var(--border);
                box-shadow: 0 -4px 24px rgba(0,0,0,0.14);
            }
            [data-sidebar-pos="bottom"] .sidebar-brand { padding: 0 18px; border-bottom: none; border-right: 1px solid var(--border); height: 100%; flex-shrink: 0; }
            [data-sidebar-pos="bottom"] .sidebar-nav { flex-direction: row; align-items: center; padding: 0 6px; flex-shrink: 1; overflow-x: auto; overflow-y: hidden; height: 100%; }
            [data-sidebar-pos="bottom"] .sidebar-nav-btn { width: auto; flex-shrink: 0; white-space: nowrap; }
            [data-sidebar-pos="bottom"] .sidebar-nav-btn.active::before {
                left: 50%; top: -2px; bottom: auto; transform: translateX(-50%);
                width: 60%; height: 3px; border-radius: 0 0 4px 4px;
            }
            [data-sidebar-pos="bottom"] .sidebar-spacer { flex: 1; }
            [data-sidebar-pos="bottom"] .sidebar-search-slot {
                display: flex; align-items: center; height: 100%;
                padding: 0 12px; flex-shrink: 0; width: min(320px, 30vw);
                border-left: 1px solid var(--border);
            }
            [data-sidebar-pos="bottom"] .sidebar-search-slot .search-container { width: 100%; max-width: none; }
            [data-sidebar-pos="bottom"] #topbar { display: none; }
            [data-sidebar-pos="bottom"] .sidebar-bottom { border-top: none; border-left: 1px solid var(--border); padding: 0 14px; height: 100%; display: flex; align-items: center; flex-shrink: 0; }
            [data-sidebar-pos="bottom"] .sidebar-acct-btn { width: auto; }
            [data-sidebar-pos="bottom"] #main-content { margin-left: 0; margin-bottom: var(--sidebar-bar-size); }
            [data-sidebar-pos="bottom"] .settings-backdrop { left: 0; bottom: var(--sidebar-bar-size); }
            [data-sidebar-pos="bottom"] .settings-menu {
                left: 0 !important; right: 0 !important; top: 0 !important; bottom: var(--sidebar-bar-size) !important;
                width: 340px; max-height: calc(100vh - var(--sidebar-bar-size)) !important; min-height: 0 !important;
                border-right: 1px solid var(--border) !important;
                box-shadow: 0 12px 40px rgba(0,0,0,0.3) !important;
            }
        }

        /* ── Top search bar ── */
        #topbar {
            background: color-mix(in srgb, var(--bg) 72%, transparent);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border-bottom: 1px solid var(--border);
            padding: calc(14px + var(--safe-top)) clamp(14px,3%,28px) 14px;
            position: sticky; top: 0; z-index: 800;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        #topbar .search-container { flex: 1; max-width: 600px; }

        /* Center game content */
        #main-content > .shelf-container,
        #main-content > .gotw-container,
        #main-content > nav.filter-bar,
        #main-content > main#game-grid {
            max-width: 1280px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
        }



        /* ── Mobile: hide sidebar, show header ── */
        /* ── MOBILE NAVIGATION ──────────────────────────────────────────── */
        .mobile-nav-toggle {
            background: transparent;
            border: 1px solid transparent;
            padding: 6px 8px; border-radius: var(--radius-sm);
            cursor: pointer; color: var(--text-muted); font-size: 1.2rem; line-height: 1;
            min-width: 36px; min-height: 36px; flex-shrink: 0;
            display: none; align-items: center; justify-content: center;
            transition: color 0.1s, background 0.1s;
        }
        .mobile-nav-toggle:hover { color: var(--text); background: color-mix(in srgb, var(--text) 8%, transparent); }

        .mobile-nav-backdrop {
            display: none; position: fixed; inset: 0; z-index: 1998;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(2px);
            animation: fadeIn 0.15s ease-out;
        }
        .mobile-nav-backdrop.show { display: block; }

        .mobile-nav-drawer {
            display: none; position: fixed; left: 0; top: 0; bottom: 0; z-index: 1999;
            width: min(280px, 85vw); background: var(--header-gradient);
            border-right: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            overflow-y: auto; padding: 12px 0; animation: slideIn 0.24s var(--ease);
        }
        .mobile-nav-drawer.show { display: flex; flex-direction: column; }

        .mobile-nav-close {
            background: transparent; border: none; padding: 12px;
            color: var(--text-muted); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; margin: 0 auto 12px;
            transition: color 0.1s;
        }
        .mobile-nav-close:hover { color: var(--text); }

        .mobile-nav-content {
            display: flex; flex-direction: column; gap: 2px;
        }

        .mobile-nav-btn {
            background: none; border: none; color: var(--text-muted);
            padding: 12px 16px; cursor: pointer; font-size: 0.95rem;
            display: flex; align-items: center; gap: 12px; text-align: left;
            transition: background 0.1s, color 0.1s; position: relative;
            font-family: inherit; font-weight: 500;
        }
        .mobile-nav-btn:hover { background: color-mix(in srgb, var(--text) 6%, transparent); color: var(--text); }
        .mobile-nav-btn:active { background: color-mix(in srgb, var(--text) 12%, transparent); }
        .mobile-nav-btn.active {
            background: color-mix(in srgb, var(--accent) 15%, transparent);
            color: var(--accent);
            font-weight: 600;
        }
        .mobile-nav-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
        .mobile-nav-btn span:first-of-type { flex: 1; }
        .mobile-nav-btn .nav-notif {
            position: static; width: 16px; height: 16px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem; font-weight: 700; color: #fff;
        }

        @media (max-width: 680px) {
            #sidebar { display: none; }
            #main-content { margin-left: 0; padding-top: 0; }
            #topbar { display: none; }
            #mobileHeader { display: flex !important; }
            .mobile-nav-toggle { display: flex; }

            /* Mobile header improvements */
            #mobileHeader {
                padding: var(--safe-top) 12px 0 12px !important;
                height: auto !important;
                min-height: calc(var(--header-height) + var(--safe-top));
                gap: 8px;
            }
            #mobileHeader .logo-img {
                height: 20px;
                flex-shrink: 0;
            }
            #mobileHeader .search-container {
                flex: 1;
                max-width: none;
                min-width: 0;
            }
            #mobileHeader .search-container input {
                padding: 8px 12px !important;
                font-size: 14px !important;
                height: 36px !important;
            }
            #mobileHeader .controls {
                display: flex;
                gap: 6px;
                align-items: center;
            }
            #mobileHeader .controls button {
                width: 36px;
                height: 36px;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: var(--radius-sm);
            }

            /* Mobile game grid */
            #game-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: clamp(8px, 2vw, 12px);
                padding: clamp(12px, 3vw, 16px);
                padding-top: 12px;
            }
            @media (min-width: 400px) { #game-grid { grid-template-columns: repeat(2, 1fr); } }
            @media (min-width: 550px) { #game-grid { grid-template-columns: repeat(3, 1fr); } }

            /* Mobile content sections */
            .shelf-container,
            .gotw-container,
            nav.filter-bar {
                padding: clamp(12px, 3vw, 16px) !important;
            }

            /* Mobile game cards */
            .game-card {
                min-height: 0;
            }
            .game-card img {
                min-height: 80px;
            }

            /* Mobile filter bar */
            nav.filter-bar {
                gap: 6px;
                overflow-x: auto;
                padding-bottom: 8px;
                scroll-behavior: smooth;
            }

            /* Mobile main content padding */
            #main-content > * {
                margin-left: auto;
                margin-right: auto;
            }
        }

        /* ── HEADER — W11 title bar style with acrylic (mobile fallback only) ── */
        header {
            background: color-mix(in srgb, var(--bg) 70%, transparent);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            padding: 0 clamp(16px, 3%, 28px);
            padding-top: var(--safe-top);
            height: calc(56px + var(--safe-top));
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid var(--border);
            transition: all 0.2s ease;
            box-shadow: none;
        }
        .logo-img { height: 28px; flex-shrink: 0; max-width: 120px; object-fit: contain; }
        .search-container { flex-grow: 1; min-width: 0; max-width: 340px; }

        /* Modern pill search box */
        #searchInput {
            width: 100%; padding: 10px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: color-mix(in srgb, var(--surface2) 80%, transparent);
            color: var(--text);
            font-family: inherit; font-weight: 400; font-size: 15px; outline: none;
            transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
        }
    </style>
</head>

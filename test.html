<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vortex | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #a855f7;
            --accent-hover: #9333ea;
            --bg-main: #060608;
            --bg-side: #0f0f12;
            --surface: #16161a;
            --border: rgba(255, 255, 255, 0.05);
            --text: #f4f5f9;
            --text-muted: rgba(244, 245, 249, 0.5);
            --radius: 12px;
            --sidebar-width: 260px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-main);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        /* --- SIDEBAR --- */
        #sidebar {
            width: var(--sidebar-width);
            background: var(--bg-side);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            border-right: 1px solid var(--border);
        }

        .logo-area { padding: 0 12px 32px; display: flex; align-items: center; }
        .logo-img { height: 32px; }

        .nav-group { display: flex; flex-direction: column; gap: 4px; }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
        .nav-item.active { background: var(--accent); color: white; }
        .nav-item svg { width: 20px; height: 20px; }

        /* --- MAIN CONTENT --- */
        #main-wrapper {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 24px 48px;
            max-width: 1600px;
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            position: relative;
        }

        .search-container { width: 450px; position: relative; }
        .search-container input {
            width: 100%;
            background: var(--bg-side);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 16px;
            color: white;
            outline: none;
        }

        .header-right { position: absolute; right: 0; display: flex; align-items: center; gap: 15px; }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }

        .user-pill img { width: 32px; height: 32px; border-radius: 6px; background: var(--surface); }

        /* --- HERO --- */
        .hero { display: flex; align-items: center; gap: 40px; margin-bottom: 60px; }
        .hero-avatar { width: 180px; height: 180px; object-fit: contain; }
        
        .hero-info h1 { font-size: 32px; font-weight: 800; margin: 0 0 10px; }
        
        .friends-row { display: flex; gap: 15px; margin-top: 15px; }
        .friend-item { text-align: center; width: 70px; }
        .friend-item img { width: 64px; height: 64px; border-radius: 12px; background: var(--surface); margin-bottom: 8px; }
        .friend-name { font-size: 12px; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; }
        .status-dot { color: var(--text-muted); font-size: 10px; }

        /* --- GRID --- */
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
        #game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .game-card { text-decoration: none; color: inherit; }
        .game-thumb {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            object-fit: cover;
            background: var(--surface);
            margin-bottom: 10px;
            transition: transform 0.2s;
        }
        .game-card:hover .game-thumb { transform: translateY(-5px); }
        .game-name { font-weight: 700; font-size: 15px; display: block; margin-bottom: 4px; }
        .game-stats { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }

        /* --- SETTINGS VIEW (The New Section) --- */
        #settings-view { display: none; }
        .settings-grid { display: grid; grid-template-columns: 300px 1fr; gap: 30px; margin-top: 30px; }
        .settings-card { background: var(--bg-side); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
        
        .settings-profile-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .settings-profile-header img { width: 40px; height: 40px; border-radius: 8px; }

        .settings-nav { display: flex; flex-direction: column; gap: 5px; }
        .s-nav-btn {
            padding: 12px 16px; border-radius: 8px; color: var(--text-muted); 
            font-weight: 600; cursor: pointer;
        }
        .s-nav-btn.active { background: var(--accent); color: white; }

        .info-table { width: 100%; border-collapse: collapse; }
        .info-row { border-bottom: 1px solid var(--border); }
        .info-row td { padding: 20px 0; }
        .info-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .info-val { font-weight: 600; }
        
        .edit-btn { 
            background: var(--surface); border: 1px solid var(--border); color: white;
            padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px;
        }

        .danger-text { color: #ff4d4d; text-align: center; margin-top: 40px; cursor: pointer; font-weight: 700; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-overlay.show { display: flex; }
        .auth-modal { background: var(--bg-side); padding: 30px; border-radius: 16px; width: 350px; border: 1px solid var(--border); }
        .auth-modal input { width: 100%; padding: 12px; margin-bottom: 10px; background: var(--bg-main); border: 1px solid var(--border); color: white; border-radius: 8px; }
        .auth-btn { width: 100%; padding: 12px; background: var(--accent); border: none; color: white; font-weight: 700; border-radius: 8px; cursor: pointer; }

        @media (max-width: 1000px) {
            #sidebar { display: none; }
            #main-wrapper { margin-left: 0; padding: 20px; }
            .settings-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="logo-area">
            <img src="https://raw.githubusercontent.com/ElliottC823/powerhouse/main/icons/POWERHOUSE-dark.svg" class="logo-img" alt="Vortex">
        </div>
        <nav class="nav-group">
            <div class="nav-item active" onclick="showPage('home')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Home
            </div>
            <div class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Profile
            </div>
            <div class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Friends
            </div>
            <div class="nav-item" onclick="showPage('settings')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> Settings
            </div>
        </nav>
    </aside>

    <main id="main-wrapper">
        <header>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search players..." oninput="renderGames()">
            </div>
            <div class="header-right">
                <div class="user-pill" onclick="handleUserClick()">
                    <span id="nav-username">Sign In</span>
                    <img id="nav-pfp" src="https://raw.githubusercontent.com/ElliottC823/powerhouse/main/icons/user.svg">
                </div>
            </div>
        </header>

        <!-- HOME VIEW -->
        <div id="home-view">
            <section class="hero">
                <img id="hero-avatar" class="hero-avatar" src="https://raw.githubusercontent.com/ElliottC823/powerhouse/main/icons/user.svg">
                <div class="hero-info">
                    <h1 id="welcome-text">Hello, Guest!</h1>
                    <div class="friends-row" id="friends-list">
                        <!-- Friends render here -->
                    </div>
                </div>
            </section>

            <div class="section-title">Popular right now</div>
            <div id="game-grid"></div>
        </div>

        <!-- SETTINGS VIEW -->
        <div id="settings-view">
            <h1>Settings</h1>
            <div class="settings-grid">
                <div class="settings-sidebar">
                    <div class="settings-card settings-profile-header">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <img id="sett-pfp" src="">
                            <span id="sett-name" style="font-weight:700;">Username</span>
                        </div>
                        <button class="edit-btn" style="background:#ff4d4d20; color:#ff4d4d; border:none;" onclick="logout()">Logout</button>
                    </div>
                    <div class="settings-card settings-nav">
                        <div class="s-nav-btn active">Account</div>
                        <div class="s-nav-btn">Security & Privacy</div>
                        <div class="s-nav-btn">Sessions</div>
                    </div>
                </div>

                <div class="settings-card">
                    <h2 style="margin-top:0">Account Info</h2>
                    <table class="info-table">
                        <tr class="info-row">
                            <td>
                                <div class="info-label">Username</div>
                                <div class="info-val" id="val-username">Guest</div>
                            </td>
                            <td style="text-align:right;"><button class="edit-btn">Edit</button></td>
                        </tr>
                        <tr class="info-row">
                            <td>
                                <div class="info-label">Email</div>
                                <div class="info-val">user********@gmail.com</div>
                            </td>
                            <td style="text-align:right;"><button class="edit-btn">Edit</button></td>
                        </tr>
                    </table>
                    <div class="danger-text" onclick="alert('Delete requested')">Danger Zone</div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="loginModal">
        <div class="auth-modal">
            <h2 style="margin-top:0">Login</h2>
            <input type="text" id="loginUser" placeholder="Username">
            <input type="password" id="loginPass" placeholder="Password">
            <button class="auth-btn" onclick="login()">Sign In</button>
            <button class="auth-btn" style="background:none; margin-top:5px;" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        const PFP_BASE = 'https://raw.githubusercontent.com/ElliottC823/powerhouse/main/profileicons/';
        const API_BASE = 'https://powerhouse-api.c823.workers.dev';
        
        let games = [];
        let user = {
            token: localStorage.getItem('ph_token'),
            username: localStorage.getItem('ph_username'),
            pfp: localStorage.getItem('ph_pfp')
        };

        window.onload = async () => {
            await fetchGames();
            if (user.token) await fetchUserData();
            updateUI();
        };

        async function fetchGames() {
            try {
                const r = await fetch('https://raw.githubusercontent.com/ElliottC823/powerhouse/main/games.txt');
                games = await r.json();
                renderGames();
            } catch(e) {}
        }

        async function fetchUserData() {
            try {
                const r = await fetch(`${API_BASE}/auth/load`, {
                    headers: { 'Authorization': `Bearer ${user.token}` }
                });
                if (r.ok) {
                    const { data } = await r.json();
                    if (data.settings?.pfp) {
                        user.pfp = data.settings.pfp;
                        localStorage.setItem('ph_pfp', user.pfp);
                    }
                }
            } catch(e) {}
        }

        function updateUI() {
            const isGuest = !user.username;
            const displayName = isGuest ? 'Guest' : user.username;
            const pfpUrl = user.pfp ? PFP_BASE + user.pfp : 'https://raw.githubusercontent.com/ElliottC823/powerhouse/main/icons/user.svg';

            document.getElementById('welcome-text').textContent = `Hello, ${displayName}!`;
            document.getElementById('nav-username').textContent = displayName;
            document.getElementById('nav-pfp').src = pfpUrl;
            document.getElementById('hero-avatar').src = pfpUrl;
            
            // Settings UI
            document.getElementById('sett-name').textContent = displayName;
            document.getElementById('sett-pfp').src = pfpUrl;
            document.getElementById('val-username').textContent = displayName;
        }

        function renderGames() {
            const grid = document.getElementById('game-grid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = games.filter(g => g.title.toLowerCase().includes(search));

            grid.innerHTML = filtered.map(g => `
                <a href="${g.link}" class="game-card" target="_blank">
                    <img src="${g.thumb}" class="game-thumb">
                    <span class="game-name">${g.title}</span>
                    <div class="game-stats">
                        <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16"><path d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1H7zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>
                        ${Math.floor(Math.random() * 20)} playing
                    </div>
                </a>
            `).join('');
        }

        function showPage(page) {
            document.getElementById('home-view').style.display = page === 'home' ? 'block' : 'none';
            document.getElementById('settings-view').style.display = page === 'settings' ? 'block' : 'none';
            
            // Update active state
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.toggle('active', el.textContent.toLowerCase().includes(page));
            });
        }

        function handleUserClick() {
            if (!user.token) document.getElementById('loginModal').classList.add('show');
            else showPage('settings');
        }

        function closeModal() { document.getElementById('loginModal').classList.remove('show'); }

        async function login() {
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;
            try {
                const r = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await r.json();
                if (r.ok) {
                    localStorage.setItem('ph_token', data.token);
                    localStorage.setItem('ph_username', data.username);
                    location.reload();
                } else alert(data.error);
            } catch(e) { alert("Login failed"); }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>

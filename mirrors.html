<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Powerhouse Mirrors</title>
    <link rel="icon" id="faviconEl" type="image/png" href="https://raw.githubusercontent.com/ElliottC823/powerhouse/main/icons/powerhouse-icon-dark.png?timestamp=1">
    <link rel="shortcut icon" type="image/png" href="https://raw.githubusercontent.com/ElliottC823/powerhouse/main/icons/powerhouse-icon-dark.png?timestamp=1">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/ElliottC823/powerhouse/main/icons/powerhouse-icon-dark.png?timestamp=1">
    <link id="fontLink" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #0078D4;
            --accent2: #106EBE;
            --accent-light: rgba(0,120,212,0.12);
            --radius: 8px;
            --radius-sm: 6px;
            --radius-xs: 4px;
            --header-height: 48px;
            --font: 'Outfit', sans-serif;
            --font-weight-normal: 400;
            --font-weight-bold: 600;
            --font-weight-black: 700;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        [data-theme="midnight"] {
            --bg: #1a1d2e; --bg-gradient: linear-gradient(160deg,#1a1d2e 0%,#141620 100%);
            --header-gradient: linear-gradient(90deg,#1e2235 0%,#252840 100%);
            --surface: #22263a; --surface2: #2a2f47; --text: #e8eaf6;
            --text-muted: rgba(232,234,246,0.5); --border: #363a55;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        [data-theme="dark"] {
            --bg: #0d0e12; --bg-gradient: linear-gradient(160deg,#0d0e12 0%,#13151b 100%);
            --header-gradient: linear-gradient(90deg,#13151b 0%,#1a1c24 100%);
            --surface: #1e2028; --surface2: #252830; --text: #f5f6fa;
            --text-muted: rgba(245,246,250,0.5); --border: #35394a;
            --shadow: 0 4px 24px rgba(0,0,0,0.5);
        }
        [data-theme="amoled"] {
            --bg: #000; --bg-gradient: #000;
            --header-gradient: linear-gradient(90deg,#0a0a0a,#111);
            --surface: #111; --surface2: #1a1a1a; --text: #fff;
            --text-muted: rgba(255,255,255,0.45); --border: #222;
            --shadow: 0 4px 24px rgba(0,0,0,0.7);
        }
        [data-theme="light"] {
            --bg: #f2f3f8; --bg-gradient: linear-gradient(160deg,#f2f3f8 0%,#e8eaf4 100%);
            --header-gradient: linear-gradient(90deg,#fff 0%,#f2f3f8 100%);
            --surface: #fff; --surface2: #f0f1f7; --text: #060712;
            --text-muted: rgba(6,7,18,0.45); --border: #d4d7ea;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', system-ui, sans-serif;
            background: var(--bg-gradient);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
        }

        /* ── Mica noise texture ── */
        body::after {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.022;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Header ── */
        header {
            position: sticky; top: 0; z-index: 100;
            height: calc(var(--header-height) + var(--safe-top));
            padding: var(--safe-top) 20px 0;
            background: var(--header-gradient);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .logo-img {
            height: 24px;
            object-fit: contain;
            opacity: 0;
            animation: fadeUp 0.5s ease 0.1s forwards;
        }

        /* ── Page content ── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: calc(40px + var(--safe-top))
                     calc(20px + var(--safe-right))
                     calc(40px + var(--safe-bottom))
                     calc(20px + var(--safe-left));
            position: relative;
            z-index: 1;
            gap: 24px;
        }

        /* ── Card ── */
        .container {
            background: color-mix(in srgb, var(--surface) 70%, transparent);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: clamp(28px, 6vw, 40px);
            width: 100%;
            max-width: 480px;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            box-shadow: var(--shadow);
            opacity: 0;
            transform: translateY(12px);
            animation: fadeUp 0.4s ease 0.15s forwards;
        }

        /* ── Logo block ── */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding-bottom: 24px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .card-logo {
            width: clamp(160px, 70%, 240px);
            height: auto;
            display: block;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.1));
        }

        .page-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--text-muted);
            margin: 0;
        }

        .page-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
            margin: 12px 0 0 0;
            line-height: 1.5;
        }

        /* ── Mirror links ── */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
            width: 100%;
        }

        .mirror-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: color-mix(in srgb, var(--surface2) 40%, var(--surface));
            border: 1px solid var(--border);
            padding: 14px 16px;
            min-height: 56px;
            border-radius: var(--radius-sm);
            color: var(--text);
            text-decoration: none;
            transition: all 0.12s ease-out;
            -webkit-user-select: none;
            user-select: none;
        }

        @media (hover: hover) {
            .mirror-link:hover {
                border-color: var(--accent);
                background: color-mix(in srgb, var(--accent) 10%, var(--surface));
                color: var(--accent);
                transform: translateY(-2px);
            }
            .mirror-link:hover .mirror-arrow { opacity: 1; }
        }

        .mirror-link:active { opacity: 0.8; transform: translateY(0); }

        .mirror-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }

        .mirror-link-label {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .disclaimer {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mirror-arrow {
            font-size: 0.9rem;
            opacity: 0.4;
            flex-shrink: 0;
            transition: opacity 0.12s ease-out;
        }

        /* ── Footer ── */
        .footer {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            text-align: center;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            width: 100%;
        }

        /* ── Animations ── */
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            main {
                padding: calc(28px + var(--safe-top))
                         calc(16px + var(--safe-right))
                         calc(28px + var(--safe-bottom))
                         calc(16px + var(--safe-left));
            }
            .container {
                padding: clamp(20px, 5vw, 28px);
            }
        }
    </style>
</head>
<body data-theme="midnight">

    <header>
        <img class="logo-img"
             src="https://raw.githubusercontent.com/ElliottC823/powerhouse/main/icons/POWERHOUSE-dark.svg"
             alt="Powerhouse">
    </header>

    <main>
        <div class="container">

            <div class="logo-container">
                <img src="https://raw.githubusercontent.com/ElliottC823/powerhouse/main/icons/POWERHOUSE-dark.svg"
                     alt="Powerhouse" class="card-logo">
                <p class="page-title">Mirror Links</p>
                <p class="page-desc">Access Powerhouse from alternate locations</p>
            </div>

            <div class="link-list">
                <a href="https://powerhouse.c823.workers.dev/" target="_blank" rel="noopener" class="mirror-link">
                    <div class="mirror-text">
                        <span class="mirror-link-label">Cloudflare (Main)</span>
                        <span class="disclaimer">Primary instance — always latest</span>
                    </div>
                    <span class="mirror-arrow">↗</span>
                </a>
                <a href="https://kraftpaket.c1120.workers.dev" target="_blank" rel="noopener" class="mirror-link">
                    <div class="mirror-text">
                        <span class="mirror-link-label">Cloudflare (Backup)</span>
                        <span class="disclaimer">Fallback — may lag behind</span>
                    </div>
                    <span class="mirror-arrow">↗</span>
                </a>
            </div>

            <div class="footer">Powerhouse V2.5.4 (2026-05-29)</div>

        </div>
    </main>

</body>
</html>
